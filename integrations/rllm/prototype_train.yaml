{
  "rllm": {
    "workflow": {
      "n_parallel_tasks": 2,
      "retry_limit": 3,
      "raise_on_error": false
    },
    "rollout": {
      "n": 2,
      "train": {
        "temperature": 0.7,
        "top_p": 1.0,
        "max_tokens": 1200
      },
      "val": {
        "temperature": 0.7,
        "top_p": 1.0,
        "max_tokens": 1200
      }
    },
    "compact_filtering": {
      "enable": true,
      "mask_error": true
    },
    "rejection_sample": {
      "min_trajs_per_group": 2
    }
  }
}
