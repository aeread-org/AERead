<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(v){let t=esc(v);t=t.replace(/`([^`\n]+)`/g,'<code>$1</code>');t=t.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');t=t.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g,'<span class="mdlink" title="$2">$1</span>');t=t.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s.,;:)]|$)/g,'$1<em>$2</em>');return t;}
const fmt=(x,d=2)=>(x==null||isNaN(x))?'n/a':Number(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=x=>(x<0?'-':'')+'$'+fmt(Math.abs(x),x<1?4:2);
const sign=x=>x>0?'+'+fmt(x):fmt(x);
const STATE_LABEL={yes:'yes',partial:'partial',no:'no','not stated':'not stated'};
const stateCls=s=>s==='yes'?'yes':s==='partial'?'partial':s==='no'?'no':'na';
const PHASE_COLORS=['ph1','ph2','ph3','ph4','ph5','ph6','ph7','ph8'];
let CAT=null, LENS={}, RESULTS={}; const campaignCache={}, lensCache={};
function expandObj(cur,prev,prevAny){const out={};Object.entries(cur).forEach(([k,v])=>{const isO=v&&typeof v==='object'&&!Array.isArray(v);const keys=isO?Object.keys(v):[];if(isO&&v.$p===1&&keys.length===1)out[k]=prev?prev[k]:undefined;else if(isO&&v.$pa===1&&keys.length===1)out[k]=prevAny?prevAny[k]:undefined;else if(isO&&typeof v.$pp==='number'&&Array.isArray(v.t)&&keys.length===2)out[k]=((prev&&prev[k])||[]).slice(0,v.$pp).concat(v.t);else if(isO&&typeof v.$pe==='number'&&v.d&&Array.isArray(v.t)&&keys.length===3){const base=((prev&&prev[k])||[]).slice(0,v.$pe);Object.entries(v.d).forEach(([i,x])=>{base[Number(i)]=x;});out[k]=base.concat(v.t);}else out[k]=v;});return out;}
function expandLens(lens){if(!lens||!lens.compact)return lens;lens.cases.forEach(c=>{const prevBySeat={};let prevState=null,prevAny=null;(c.phases||[]).forEach(ph=>{(ph.actions||[]).forEach(a=>{const o=a.observation;if(o&&typeof o==='object'&&!Array.isArray(o)){a.observation=expandObj(o,prevBySeat[a.seat],prevAny);prevBySeat[a.seat]=a.observation;prevAny=a.observation;}});const st=ph.post_state;if(st&&typeof st==='object'&&!Array.isArray(st)){if(prevState)ph.post_state=expandObj(st,prevState,null);prevState=ph.post_state;}});if(c.terminal&&c.outcome&&typeof c.terminal==='object'){Object.entries(c.terminal).forEach(([k,v])=>{if(v&&typeof v==='object'&&v.$o===1&&Object.keys(v).length===1)c.terminal[k]=c.outcome[k];});}});return lens;}
async function loadLens(c){const m=LENS[c.id];if(!m||!m.file)return null;return lensCache[c.id]||(lensCache[c.id]=await getJSON(m.file).then(expandLens));}
const lensNote=c=>{const m=LENS[c.id];if(!m||m.kind==='none'||!m.file)return 'action-level grain only';if(m.kind==='narrated')return 'full-detail lens: observations, market state and a narrated reading';if(m.kind==='sealed')return 'full-detail lens: observations, states and consequences from the sealed event logs'+(m.shown_rule?` (${m.shown_rule})`:'');if(m.kind==='mixed')return `full detail for ${m.sealed} of ${m.cases} cases from sealed logs; the rest from case files`;return 'case definitions from the repository; the sealed logs for this run are not on this machine';};
let route={view:'catalog',family:null,campaign:null,caseId:null,step:0};

async function getJSON(path){const r=await fetch(path);if(!r.ok)throw new Error(path+' → '+r.status);const j=await r.json();if(!(j&&j.encoding==='gzip+base64'&&typeof j.payload==='string'))return j;if(typeof DecompressionStream==='undefined')throw new Error('this browser cannot inflate the data files (DecompressionStream missing)');const bin=atob(j.payload);const buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);const text=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();return JSON.parse(text);}
function save(){try{localStorage.setItem('aeread-examiner-route',JSON.stringify(route));}catch(e){}}
function crumbs(){
  const parts=[`<button data-go="catalog">Catalog</button>`];
  if(route.family) parts.push('›',`<button data-go="family">${esc(CAT.family_label[route.family]||route.family)}</button>`);
  if(route.campaign) parts.push('›',`<button data-go="campaign" class="mono">${esc(route.campaign)}</button>`);
  if(route.view==='results'&&route.campaign) parts.push('›',`<span class="cur">results</span>`);
  const caseCrumb=route.caseId&&(route.view==='step'||(route.view==='detail'&&route.detail&&['cell','invalid','rubric','ladder'].includes(route.detail.kind)));
  if(caseCrumb){const cd=route.campaign&&campaignCache[route.campaign];const kk=cd&&cd.cases.find(x=>x.receipt_sha256===route.caseId||(x.cell_id+'|'+x.episode_attempt_id)===route.caseId);parts.push('›',`<span class="cur mono">${esc(kk?kk.case_id+' · '+(kk.receipt_sha256||'').slice(0,10):String(route.caseId).slice(0,16))}</span>`);}
  if(route.view==='detail') parts.push('›',`<span class="cur">${esc(detailLabel())}</span>`);
  if(route.view==='models') parts.push('›',`<span class="cur">model comparisons</span>`);
  if(route.view==='defs') parts.push('›',`<span class="cur">strata and baselines</span>`);
  $('crumbs').innerHTML=parts.join(' ');
  $('crumbs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const g=b.dataset.go; if(g==='catalog'){route={view:'catalog',family:null,campaign:null,caseId:null,step:0};} else if(g==='family'){route.view='catalog';route.campaign=null;route.caseId=null;} else {route.view='campaign';route.caseId=null;} render();}));
}
const byId=id=>CAT.campaigns.find(c=>c.id===id);
function miniBar(check){const counts={yes:0,partial:0,no:0,na:0};check.forEach(i=>counts[stateCls(i.state)]++);const n=check.length||1;return `<span class="mini" title="${esc(Object.entries(counts).map(([k,v])=>k+' '+v).join(', '))}">${Object.entries(counts).map(([k,v])=>v?`<i class="${k}" style="width:${100*v/n}%"></i>`:'').join('')}</span>`;}

// ---------------- declared graphs per family ----------------
function familyGraphs(family){const pkg={datacenter_development_terms:'datacenter_development_terms'}[family]||family;return ((CAT.declared_graphs||{})[pkg]||[]).filter(v=>Array.isArray(v.nodes)&&v.nodes.length).slice().sort((a,b)=>a.nodes.length-b.nodes.length||a.edges.length-b.edges.length||String(a.variant||'').localeCompare(String(b.variant||'')));}
// When several declared graphs cover the phases a campaign ran, pick by the
// campaign's own identity (an interface-3 run gets the interface-3 graph, which
// adds the decline edge), then the tightest graph. The first match used to win,
// so interface-3 campaigns were drawn without their extra edge.
function bestDeclared(c,vs,nodes){const cand=vs.filter(v=>nodes.every(n=>v.nodes.includes(n)));if(cand.length<=1)return cand[0]||null;const wantIface=/interface3|iface3/.test(c.id);const pref=cand.filter(v=>/iface3/.test(v.variant||'')===wantIface);return (pref.length?pref:cand).sort((a,b)=>a.nodes.length-b.nodes.length||a.edges.length-b.edges.length)[0];}
// Curated facts a graph cannot carry: which family version and case folders a
// declared scope belongs to. Keyed by plugin and variant, as the build reports them.
const DECLARED_NOTES={
 'RiskAllocationPlugin|default':'the integrator-client risk-allocation case: one phase, negotiate, repeated each round. The model proposes a full package and a price, accepts a standing offer or walks; the scripted counterpart answers inside the step',
 'TwoSidedPlugin|default':'the same case with both seats played: integrator and client moves alternate, six in all, each a full package and a price (or a price request), an accept or a walk; graded on the joint value lost at both true private costs',
 'DataCenterDevelopmentPlugin|default':'family version 1.0.0 · case dev/service_loan_bankability_001',
 "DataCenterStackPlugin|init('v1',)":'family version 1.1.0 · case v1/power_epc_bankability_001',
 "DataCenterStackPlugin|init('v2',)":'family version 2.0.0 · cases v2/, worlds_v2/, worlds_v3/; the counteroffer ladders run its opening agreements',
 "DataCenterStackPlugin|init('v2',) iface3":'family version 2.0.0 with developer interface 3 · the same worlds',
};
const EDGE_NOTES={'land_amendment_developer_offer>loan_developer_offer':'the developer may decline the land amendment and go straight to the loan (interface 3; before it the phase had no way to say no, DC-D-10)'};
// A stack graph is a chain of agreements, each the same loop: developer offer,
// counterparty response (which may counter back to an offer), developer commit.
function stackParts(v){const re=/^(.+)_([a-z]+)_(offer|response|commit)$/;const parts=v.nodes.map(n=>n.match(re));if(!parts.every(Boolean))return null;const order=[];const role={};parts.forEach(m=>{if(!order.includes(m[1]))order.push(m[1]);if(m[3]==='response')role[m[1]]=m[2];});
 const std=new Set();order.forEach((k,i)=>{const o=parts.find(m=>m[1]===k&&m[3]==='offer'),r=parts.find(m=>m[1]===k&&m[3]==='response'),c=parts.find(m=>m[1]===k&&m[3]==='commit');if(o&&r){std.add(o[0]+'>'+r[0]);std.add(r[0]+'>'+o[0]);}if(r&&c)std.add(r[0]+'>'+c[0]);const nx=order[i+1]&&parts.find(m=>m[1]===order[i+1]&&m[3]==='offer');if(c&&nx)std.add(c[0]+'>'+nx[0]);});
 const extra=v.edges.map(e=>e.from+'>'+e.to).filter(k=>!std.has(k));return {order,role,extra};}
const agreementLabel=k=>({epc:'EPC (construction)',land_amendment:'land amendment'}[k]||k.replace(/_/g,' '));
const EDGE_SHORT={'land_amendment_developer_offer>loan_developer_offer':'decline'};
// The stack drawn one box per agreement, in the phase graph's own style, three
// to a row and snaking so it stays readable in a card; an edge outside the
// standard loop is a dashed arrow with its label.
function agreementSvg(sp){const n=sp.order.length,cols=Math.min(3,n),rows=Math.ceil(n/cols),BW=124,BH=44,GX=34,GY=36,M=10;
 const W=M*2+cols*BW+(cols-1)*GX,H=M*2+rows*BH+(rows-1)*GY+(sp.extra.length?30:0);
 const pos=sp.order.map((k,i)=>{const r=Math.floor(i/cols),j=i%cols,c=r%2===0?j:cols-1-j;return {x:M+c*(BW+GX),y:M+r*(BH+GY),r};});
 const keyOf=node=>{let best=-1;sp.order.forEach((k,i)=>{if(node.startsWith(k+'_')&&(best<0||k.length>sp.order[best].length))best=i;});return best;};
 let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="agreement sequence"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>`;
 const link=(a,b,dashed,label)=>{const A=pos[a],B=pos[b];let d,lx,ly;if(A.r===B.r&&dashed){const x1=A.x+BW/2,x2=B.x+BW/2,y=A.y+BH,dip=y+24;d=`M${x1},${y} C${x1},${dip} ${x2},${dip} ${x2},${y+2}`;lx=(x1+x2)/2;ly=dip+4;}else if(A.r===B.r){const dir=B.x>A.x?1:-1;const x1=dir>0?A.x+BW:A.x,x2=dir>0?B.x-2:B.x+BW+2,y=A.y+BH/2;d=`M${x1},${y} L${x2},${y}`;lx=(x1+x2)/2;ly=y+20;}else{const x=A.x+BW/2+(dashed?22:0);d=dashed?`M${x},${A.y+BH} C${x+16},${A.y+BH+12} ${x+16},${B.y-12} ${x},${B.y-2}`:`M${x},${A.y+BH} L${x},${B.y-2}`;lx=x+22;ly=(A.y+BH+B.y)/2+4;}
  return `<path d="${d}" fill="none" stroke="currentColor" stroke-width="1.3"${dashed?' stroke-dasharray="4 3"':''} marker-end="url(#ar)"/>${label?`<text class="sub" x="${lx}" y="${ly}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(label)}</text>`:''}`;};
 for(let i=0;i+1<n;i++)s+=link(i,i+1,false,'');
 sp.extra.forEach(e=>{const [f,to]=e.split('>');const kf=keyOf(f),kt=keyOf(to);if(kf>=0&&kt>=0&&kf!==kt)s+=link(kf,kt,true,EDGE_SHORT[e]||'extra edge');});
 sp.order.forEach((k,i)=>{const {x,y}=pos[i];const lab=agreementLabel(k);s+=`<rect x="${x}" y="${y}" width="${BW}" height="${BH}" rx="6" fill="var(--panel)" stroke="currentColor" stroke-width="1.3"/><text class="lab" x="${x+BW/2}" y="${y+19}" text-anchor="middle" font-size="${lab.length>16?10:11.5}" fill="currentColor">${esc(lab)}</text><text class="sub" x="${x+BW/2}" y="${y+34}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(sp.role[k]||'')} · 3 phases</text>`;});
 return s+'</svg>';}
function graphUsers(v){const fam=CAT.campaigns.filter(c=>familyGraphs(c.family).includes(v));return fam.filter(c=>{const ph=(c.grain||{}).phases||[];return ph.length&&bestDeclared(c,familyGraphs(c.family),ph)===v;});}
function runAt(c){return String((c.order||{}).at||c.date||'').replace('T',' ').slice(0,16);}
function graphVersion(v){const iface=/iface(\d+)/.exec(v.variant||'');const noted=/family version ([\d.]+)/.exec(DECLARED_NOTES[`${v.plugin}|${v.variant||''}`]||'');const ver=v.family_version||(noted&&noted[1]);return ver?`${v.family_id?v.family_id+' ':''}version ${ver}${iface?' · developer interface '+iface[1]:''}`:'';}
function graphRuns(v){const at=graphUsers(v).map(runAt).filter(Boolean).sort();return {first:at[0]||'',last:at[at.length-1]||'',n:at.length};}
function verKey(v){return String(v.family_version||(/family version ([\d.]+)/.exec(DECLARED_NOTES[`${v.plugin}|${v.variant||''}`]||'')||[])[1]||'').split('.').map(x=>x.padStart(4,'0')).join('.')+(v.variant||'');}
function graphsNewestFirst(fg){return fg.slice().sort((a,b)=>graphRuns(b).last.localeCompare(graphRuns(a).last)||verKey(b).localeCompare(verKey(a)));}
function graphStamp(v,newest){const r=graphRuns(v),ver=graphVersion(v);const when=r.n?(r.first.slice(0,10)===r.last.slice(0,10)?`run ${r.last.slice(0,10)}`:`runs ${r.first.slice(0,10)} → ${r.last.slice(0,10)}`)+` · ${r.n} campaign${r.n!==1?'s':''}`:'no published run with steps on this graph';return `<div style="font-size:12.5px;margin-bottom:3px">${newest?'<span class="chip" style="margin-right:6px">newest</span>':''}<b>${esc(ver||'version not recorded')}</b> <span class="muted">· ${esc(when)}</span></div>`;}
function graphCard(v,current,newest){const g={nodes:v.nodes,edges:v.edges,entry:v.nodes[0]};const sim=Object.values(v.modes||{}).filter(m=>m==='simultaneous').length;
 const sp=v.nodes.length>6?stackParts(v):null;const note=DECLARED_NOTES[`${v.plugin}|${v.variant||''}`]||v.note||'';
 const fam=CAT.campaigns.filter(c=>familyGraphs(c.family).includes(v));const users=fam.filter(c=>{const ph=(c.grain||{}).phases||[];return ph.length&&bestDeclared(c,familyGraphs(c.family),ph)===v;});
 const others=familyGraphs((fam[0]||{}).family||'').filter(o=>o!==v&&o.plugin===v.plugin&&(o.nodes.length<v.nodes.length||(o.nodes.length===v.nodes.length&&o.edges.length<v.edges.length)));const prev=others.length?others[others.length-1]:null;
 let diff='';if(prev&&sp){const pp=stackParts(prev);if(pp){const add=sp.order.filter(k=>!pp.order.includes(k)).map(agreementLabel);const E=new Set(prev.edges.map(e=>e.from+'>'+e.to));const newEdges=v.edges.map(e=>e.from+'>'+e.to).filter(k=>!E.has(k)&&sp.extra.includes(k));diff=[add.length?'adds '+add.join(', '):'',newEdges.length?'adds '+newEdges.length+' edge'+(newEdges.length>1?'s':'')+' (below)':''].filter(Boolean).join('; ');if(diff)diff=`Compared with the ${prev.nodes.length}-phase graph: ${diff}.`;}}
 const strip=sp?`<div class="graph gagg">${agreementSvg(sp)}</div><div class="muted" style="font-size:11.5px">One box per agreement; inside each, the same three phases: developer offer ⇄ counterparty response, then developer commit (${v.nodes.length} phases = ${sp.order.length} × 3).${sp.extra.map(k=>EDGE_NOTES[k]?` Dashed: ${esc(EDGE_NOTES[k])}.`:` Dashed: <span class="mono">${esc(k.replace('>',' → '))}</span>.`).join('')}</div>`:'';
 const used=users.length?`<details class="jd" style="margin-top:3px;font-size:11.5px"><summary>Published campaigns whose steps ran on this graph (${users.length})</summary><div style="margin-top:3px">${users.map(c=>`<button class="runnav" data-id="${esc(c.id)}" style="padding:0 5px;font-size:11px">${esc(c.id.replace(/^datacenter_/,''))}</button>`).join(' ')}</div></details>`:'<div class="muted" style="font-size:11.5px;margin-top:3px">No published campaign with steps ran on this graph (bundles that publish tables only are not matched).</div>';
 const svg=`<div class="graph${sp?' gfold':''}"${sp?' hidden':''}>${graphSvg(g,current||null,null,v.modes,v.actors)}</div>`;
 return `<div class="gcard">${graphStamp(v,newest)}<div class="muted" style="font-size:11.5px;margin-bottom:3px"><span class="mono">${esc(v.plugin)}</span>${v.variant?` · ${esc(v.variant)}`:''} · ${v.nodes.length} phase${v.nodes.length!==1?'s':''}, ${v.edges.length} edge${v.edges.length!==1?'s':''}${sim?`, ${sim} simultaneous`:''}${sp?' <button class="gtoggle" data-gfull>show full graph</button>':v.nodes.length>6?' <button class="gtoggle" data-gt>full size</button>':''}</div>${note?`<div style="font-size:12px;margin-bottom:3px">${esc(note)}</div>`:''}${diff?`<div style="font-size:12px;margin-bottom:3px">${esc(diff)}</div>`:''}${strip}${svg}${used}</div>`;}
function wireGraphToggles(){document.querySelectorAll('[data-gfull]').forEach(b=>b.addEventListener('click',()=>{const g=b.closest('.gcard').querySelector('.gfold');g.hidden=!g.hidden;if(!g.hidden)g.classList.add('full');b.textContent=g.hidden?'show full graph':'hide full graph';}));document.querySelectorAll('.gcard .runnav').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();route.view='campaign';route.campaign=b.dataset.id;route.caseId=null;render();}));document.querySelectorAll('[data-gt]').forEach(b=>b.addEventListener('click',()=>{const g=b.closest('.gcard, .panel').querySelector('.graph');g.classList.toggle('full');b.textContent=g.classList.contains('full')?'fit':'full size';}));}
function campaignGraphs(c,observed){const vs=familyGraphs(c.family);if(observed&&observed.nodes&&observed.nodes.length){const m=bestDeclared(c,vs,observed.nodes);if(m)return {variants:[m],note:'declared graph matched to the phases in this bundle\'s trajectory grain'};return {variants:[{plugin:'observed',variant:'from the sealed grain',nodes:observed.nodes,edges:observed.edges,modes:{},actors:{}}],note:'no declared graph covers the phases seen; drawn from the observed transitions'};}
  if(vs.length>1){const id=c.id;const pick=vs.filter(v=>(/v2|counteroffer|interaction|objective/.test(id)&&/v2/.test(v.variant||''))||(/lemons/.test(id)&&/lemons/.test(v.variant||'')));if(pick.length)return {variants:pick,note:'declared variants matching this identity\'s scope; no trajectory grain to confirm'};}
  return {variants:vs,note:vs.length>1?'every declared variant for this family; no trajectory grain to pick one':'the family\'s declared graph'};}

// ---------------- catalog ----------------
function renderCatalog(){
  // the owner's order first; a family not in it follows, the one with the most recent run first
  const lastAt=f=>CAT.campaigns.filter(c=>c.family===f).map(c=>(c.order||{}).at||'').sort().pop()||'';
  const pin=f=>{const i=FAMILY_ORDER.indexOf(f);return i<0?1e9:i;};
  const fams=CAT.families.slice().sort((a,b)=>pin(a)-pin(b)||lastAt(b).localeCompare(lastAt(a))||CAT.campaigns.filter(c=>c.family===b).length-CAT.campaigns.filter(c=>c.family===a).length);
  if(!route.family||!fams.includes(route.family)) route.family=fams[0];
  const tabs=fams.map(f=>`<button data-f="${f}" class="${f===route.family?'cur':''}">${esc(CAT.family_label[f]||f)} <span class="muted">${CAT.campaigns.filter(c=>c.family===f).length}</span></button>`).join('');
  const list=CAT.campaigns.filter(c=>c.family===route.family).slice().sort((a,b)=>((a.order||{}).rank||1e9)-((b.order||{}).rank||1e9));
  const cellsOf=c=>{const g=c.grain||{};const planned=(c.facts.find(f=>f.key==='planned_cells')||{}).value,done=(c.facts.find(f=>f.key==='completed_cells')||{}).value;return planned!=null?`${done??'?'} / ${planned}`:(g.cases!=null?`${g.cases} cases`:(g.legacy_rows?`${g.legacy_rows} rows`:'—'));};
  const issuesOf=c=>c.issues.length?`${c.issues.length}${c.issues.some(i=>i.state==='open')?` <button class="chip no" data-openinc="${esc(c.id)}" title="the open rows, in full">${c.issues.filter(i=>i.state==='open').length} open ›</button>`:''}`:'<span class="muted">none</span>';
  const costOf=c=>{const g=c.grain||{};return c.manifest.total_cost_usd!=null?money(c.manifest.total_cost_usd):(g.cost_usd?money(g.cost_usd):'—');};
  const trajOf=c=>c.trajectory_file?((c.grain||{}).source==='sealed_logs'?'<span class="chip yes" title="the bundle publishes cell rows only; the steps come from the sealed event logs on this machine">sealed logs</span>':'<span class="chip yes">step grain</span>'):((c.grain||{}).legacy_rows?'<span class="chip na">cell rows</span>':`<span class="chip na" title="${esc((LENS[c.id]||{}).note||'no step grain published and no sealed logs on this machine')}">none</span>`);
  const BASIS_SHORT={'sealed receipts on this machine':'receipts on disk','first commit naming it':'first commit','date in the identity':'date in id','created_date in its reports':'report date'};
  const ranOf=c=>{const o=c.order||{};if(!o.at)return '<span class="muted">unknown</span>';const t=o.at.replace('T',' ').slice(0,16);const w=o.window;const title=`${o.basis}${w?` · ${w.receipts} receipts written ${w.start.replace('T',' ')} to ${w.end.replace('T',' ')}`:''}${o.git?` · first commit ${o.git.commit} ${o.git.date.slice(0,10)}: ${o.git.subject}`:''}`;return `<span class="mono" title="${esc(title)}">${esc(t)}</span><div class="basis" title="${esc(title)}">${esc(BASIS_SHORT[o.basis]||o.basis)}${w&&w.end&&w.end!==w.start?' · to '+esc(w.end.slice(11,16)):''}</div>`;};
  const rankOf=id=>{const m=byId(id);return m&&m.order?`<button class="runnav" data-id="${esc(id)}">#${m.order.rank}</button>`:esc(id);};
  const lineageOf=c=>{const parts=[];const cmp=CARDS&&CARDS.comparisons&&CARDS.comparisons[c.id];if(cmp){const other=cmp.left_id===c.id?cmp.right_id:cmp.left_id;const m=byId(other);parts.push(`compared with ${m&&m.order?`<button class="runnav" data-id="${esc(other)}">#${m.order.rank}</button>`:esc(other)}`);}if(c.chain.length>1)parts.push(`${esc(c.version||'')} of ${c.chain.length} in <span class="mono">${esc(c.stem)}</span>`);const o=c.order||{};(o.refs||[]).forEach(r=>parts.push(`builds on ${rankOf(r)}`));(o.referred_by||[]).forEach(r=>parts.push(`used by ${rankOf(r)}`));return parts.join('<br>')||'<span class="muted">standalone</span>';};
  const stems={}; list.forEach(c=>{(stems[c.stem]=stems[c.stem]||[]).push(c);});
  // newest first by default: a chain sits where its most recent run falls, and runs of unknown time go last
  const old=!!route.oldestFirst;const rk=c=>(c.order||{}).rank;
  const stemKey=m=>old?Math.min(...m.map(c=>rk(c)??1e9)):Math.max(...m.map(c=>rk(c)??-1));
  const stemOrder=Object.entries(stems).sort((a,b)=>old?stemKey(a[1])-stemKey(b[1]):stemKey(b[1])-stemKey(a[1]));
  const rowOf=c=>`<tr class="click" data-id="${esc(c.id)}"><td class="mono">${c.order?c.order.rank:''}</td><td class="ran">${ranOf(c)}</td><td class="idc"><span class="mono">${esc(c.id)}</span> <span class="chip ${c.chain.latest?'acc':''}">${esc(c.version||c.date||'—')}${c.variant?' · '+esc(c.variant):''}</span></td><td class="what">${(c.models||[]).length?`<div style="margin-bottom:2px">${c.models.map(m=>`<span class="chip" title="model named in the bundle's reports">${esc(m)}</span>`).join(' ')}</div>`:(((c.grain||{}).profile_ids||[]).length?`<div style="margin-bottom:2px">${c.grain.profile_ids.slice(0,3).map(p=>`<span class="chip" title="profile id from the trajectory grain (the reports name no model id): ${esc(p)}"><span class="muted">profile</span> ${esc(p.length>42?p.slice(0,41)+'…':p)}</span>`).join(' ')}${c.grain.profile_ids.length>3?` <span class="muted">+${c.grain.profile_ids.length-3} more</span>`:''}</div>`:'')}${c.headline?`<div class="basis" style="white-space:normal">${esc(c.headline)}</div>`:''}${(()=>{const x=(c.readme||{}).summary||(c.order||{}).summary||'';const cut=x.length>140?x.slice(0,139).replace(/\s+\S*$/,'')+'…':x;return x?`<div class="muted" style="font-size:12px" title="${esc(x)}">${md(cut)}</div>`:'';})()}${(c.order||{}).claim?`<div class="basis" style="white-space:normal">claim: ${esc(c.order.claim.replace(/_/g,' '))}</div>`:''}</td><td>${esc(c.status.label)}</td><td>${issuesOf(c)}</td><td><button class="minibtn" data-checks="${esc(c.id)}" title="open this run's checklist; ${c.checklist.filter(i=>i.state!=='yes').length} line(s) need attention">${miniBar(c.checklist)}</button></td><td>${trajOf(c)}</td><td class="lin">${lineageOf(c)}</td></tr>`;
  const rows=stemOrder.map(([stem,members])=>{members.sort((a,b)=>a.chain.position-b.chain.position);const first=members[0],last=members[members.length-1];const lastRan=members.map(c=>(c.order||{}).at).filter(Boolean).sort().pop();const head=members.length>1?`<tr class="grp"><td colspan="9">chain <span class="mono">${esc(stem)}</span> · ${members.length} versions, ${esc(first.version||first.date||'')} → ${esc(last.version||last.date||'')} · ${old?`first ran ${esc(((first.order||{}).at||'unknown').replace('T',' ').slice(0,16))}`:`last ran ${esc((lastRan||'unknown').replace('T',' ').slice(0,16))}`} · latest <span class="mono">${esc(last.id)}</span></td></tr>`:'';return head+(old?members:members.slice().reverse()).map(rowOf).join('');}).join('');
  const groups=`<div class="stem">Run order <button class="dbtn" id="orderdir" title="switch the order">${old?'oldest first ⇅':'newest first ⇅'}</button> <span class="stemnote">· ${list.length} bundle${list.length!==1?'s':''}. ${old?'Version chains stay together, oldest version first; chains are placed by when their first version ran.':'Newest first: chains are placed by their most recent run, and the newest version heads each chain.'} # is each run's place in the family by time. “Ran” is when the bundle's sealed receipts were written on this machine, or else the first commit that names the identity (day precision).</span></div><div class="scroll"><table class="order"><thead><tr><th>#</th><th>ran</th><th>identity</th><th>model · what this run is (README)</th><th>status (as stated)</th><th>incident rows</th><th>validity checklist</th><th>trajectories</th><th>lineage</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  const famRows=(CAT.family_incidents[route.family]||[]);
  const famIssues=famRows.length?`<details style="margin-top:14px"><summary>${famRows.length} incident rows in this family's sections (all versions)</summary><div class="scroll"><table><thead><tr><th>id</th><th>state</th><th>section</th><th>defect</th><th>disposition</th></tr></thead><tbody>${famRows.map(r=>`<tr class="click" data-famrow="${esc(r.id)}"><td class="mono">${esc(r.id)}</td><td><span class="chip ${r.state==='open'?'no':r.state==='fixed'?'yes':'na'}">${esc(r.state)}</span></td><td>${esc(r.section)}</td><td style="white-space:normal">${md(r.defect)}</td><td style="white-space:normal">${md(r.disposition)}</td></tr>`).join('')}</tbody></table></div></details>`:'';
  const fg=familyGraphs(route.family);
  const oneNode=fg.length===1&&(fg[0].nodes||[]).length<=1;const graphs=fg.length?`<details class="panel" style="margin-bottom:8px" open><summary style="font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Phase graph${fg.length>1?'s':''} declared by the ${esc(CAT.family_label[route.family]||route.family)} plugin${fg.length>1?'s':''}${oneNode?` <span style="text-transform:none;letter-spacing:0;font-weight:400">· one phase, <span class="mono">${esc((fg[0].nodes||[''])[0])}</span>, repeated each turn</span>`:''}</summary>${(()=>{const ranked=graphsNewestFirst(fg);const older=ranked.slice(1);return `<div class="gwrap" style="margin-top:6px">${graphCard(ranked[0],null,ranked.length>1)}</div>${older.length?`<details style="margin-top:8px"><summary style="font-size:12.5px">Earlier versions (${older.length}): ${older.map(v=>esc(graphVersion(v)||v.plugin)+(graphRuns(v).last?' · last run '+esc(graphRuns(v).last.slice(0,10)):'')).join('; ')}</summary><div class="gwrap" style="margin-top:6px">${older.map(v=>graphCard(v)).join('')}</div></details>`:''}`;})()}</details>`:'';
  $('view').className='';
  $('view').innerHTML=`<p class="lede">Every published campaign bundle, grouped by version chain, newest first (# is each run's place in the family by time). Status is what the bundle and the QC profile state, never inferred beyond their words; the validity bar summarises the checklist on each campaign's page (green yes, amber partial, red no, grey not stated). Click a row.</p><div class="tabs">${tabs}</div>${graphs}${groups}${famIssues}`;
  $('view').querySelectorAll('.runnav').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();route.view='campaign';route.campaign=b.dataset.id;route.caseId=null;render();}));
  const od=$('orderdir');if(od)od.addEventListener('click',()=>{route.oldestFirst=!route.oldestFirst;render();});
  $('view').querySelectorAll('[data-openinc]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openDetail({kind:'incidents'},{campaign:b.dataset.openinc,caseId:null});}));
  $('view').querySelectorAll('[data-checks]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();route.view='campaign';route.campaign=b.dataset.checks;route.caseId=null;route.focus='checklist';render();}));
  $('view').querySelectorAll('[data-famrow]').forEach(tr=>tr.addEventListener('click',()=>{openDetail({kind:'incident',id:tr.dataset.famrow},{campaign:null,caseId:null});}));
  $('view').querySelectorAll('.tabs button[data-f]').forEach(b=>b.addEventListener('click',()=>{route.family=b.dataset.f;render();}));wireGraphToggles();
  $('view').querySelectorAll('tr.click').forEach(tr=>tr.addEventListener('click',()=>{route.view='campaign';route.campaign=tr.dataset.id;route.caseId=null;render();}));
}

// ---------------- campaign ----------------
function renderCampaign(){
  const c=byId(route.campaign); route.family=c.family;
  const chain=c.chain.members.map(id=>{const m=byId(id);return `<button data-id="${esc(id)}" class="${id===c.id?'cur':''}" title="${esc(m.status.label)}">${esc(m.version||m.date||id)}${m.variant?' · '+esc(m.variant):''}</button>`;}).join('<span class="muted">→</span>');
  const o=c.order||{};const prevRun=o.prev?byId(o.prev):null,nextRun=o.next?byId(o.next):null;
  const runline=`<div class="runline"><span class="chip acc">run #${o.rank||'?'} of ${o.of||'?'} in ${esc(CAT.family_label[c.family]||c.family)}</span><span class="muted">ran <span class="mono">${esc(o.at?o.at.replace('T',' ').slice(0,16):'unknown')}</span> · ${esc(o.basis||'')}</span>${prevRun?`<button class="runnav" data-id="${esc(prevRun.id)}" title="${esc(prevRun.id)}">‹ #${prevRun.order.rank} ${esc(prevRun.stem)}${prevRun.version?' '+esc(prevRun.version):''}</button>`:'<span class="muted">first run in the family</span>'}${nextRun?`<button class="runnav" data-id="${esc(nextRun.id)}" title="${esc(nextRun.id)}">#${nextRun.order.rank} ${esc(nextRun.stem)}${nextRun.version?' '+esc(nextRun.version):''} ›</button>`:'<span class="muted">latest run in the family</span>'}${(o.refs||[]).length?`<span class="muted">builds on ${o.refs.map(r=>`<button class="runnav" data-id="${esc(r)}">#${(byId(r).order||{}).rank} ${esc(r)}</button>`).join(' ')}</span>`:''}${(o.referred_by||[]).length?`<span class="muted">used by ${o.referred_by.map(r=>`<button class="runnav" data-id="${esc(r)}">#${(byId(r).order||{}).rank} ${esc(r)}</button>`).join(' ')}</span>`:''}</div>`;
  const st=c.status;
  const why=[st.claim_status?`manifest claim_status: <code>${esc(st.claim_status)}</code>`:null, st.readme_sentence?`README: “${md(st.readme_sentence)}”`:null, ...st.fact_evidence.map(e=>`report: <code>${esc(e)}</code>`)].filter(Boolean);
  // the details button sits under the state chip, so a wide table never scrolls it out of view
  const check=c.checklist.map((i,ix)=>`<tr class="click" data-ck="${ix}" title="what this line rests on"><td><span class="chip ${stateCls(i.state)}">${esc(STATE_LABEL[i.state]||i.state)}</span><div style="margin-top:4px"><button class="dbtn ${i.state!=='yes'?'att':''}" data-ck="${ix}">details ›</button></div></td><td style="white-space:normal">${esc(i.item)}</td><td>${esc(i.gate==='0-5'?'all':'Gate '+i.gate+' · '+(CAT.gate_names[i.gate]||''))}</td><td style="white-space:normal">${md(i.detail)}</td><td class="mono muted" style="white-space:normal;overflow-wrap:anywhere;font-size:11px;min-width:125px;max-width:170px">${esc(i.source)}</td></tr>`).join('');
  const facts=c.facts.map(f=>`<tr><td class="mono">${esc(f.key)}</td><td style="white-space:normal">${esc(typeof f.value==='object'?JSON.stringify(f.value):f.value)}</td><td class="mono muted">${esc(f.file)}</td></tr>`).join('');
  const issueRow=i=>`<tr class="click" data-inc="${esc(i.id)}"><td class="mono">${esc(i.id)}</td><td><span class="chip ${i.state==='open'?'no':i.state==='fixed'?'yes':'na'}">${esc(i.state)}</span></td><td class="muted">${esc(i.link)}</td><td style="white-space:normal">${md(i.defect)}</td><td style="white-space:normal">${md(i.disposition)}</td><td><button class="dbtn ${i.state==='open'?'att':''}" data-inc="${esc(i.id)}">details ›</button></td></tr>`;
  const directIssues=c.issues.filter(i=>i.direct),inheritedIssues=c.issues.filter(i=>!i.direct);
  const directOpen=directIssues.filter(i=>i.state==='open').length; // an open row naming this run needs attention, so its panel starts open
  const issues=directIssues.length?directIssues.map(issueRow).join(''):'<tr><td colspan="6" class="muted">no incident row names this run</td></tr>';
  const inheritedHtml=inheritedIssues.length?`<details style="margin-top:8px"><summary style="font-size:12.5px">${inheritedIssues.length} row${inheritedIssues.length!==1?'s':''} from this family's sections that do not name this run (${inheritedIssues.filter(i=>i.state==='open').length} open): background, may or may not apply</summary><div class="scroll"><table><thead><tr><th>id</th><th>state</th><th>link</th><th>defect</th><th>disposition</th><th></th></tr></thead><tbody>${inheritedIssues.map(issueRow).join('')}</tbody></table></div></details>`:'';
  const qc=c.external?`<p class="muted" style="margin:0">No QC profile: this is not an AERead family.</p>`:c.qc.sections.length?c.qc.sections.map(s=>`<div class="block"><div><span class="em">${esc(s.heading)}</span> <span class="muted mono">${esc(s.path||'')}</span></div>${s.gate_sentences.map(x=>`<p style="margin:4px 0">${md(x)}</p>`).join('')}${s.status_sentences.filter(x=>!s.gate_sentences.includes(x)).slice(0,4).map(x=>`<p class="muted" style="margin:4px 0">${md(x)}</p>`).join('')}</div>`).join(''):'<p class="muted">The family QC profile does not mention this identity.</p>';
  const g=c.grain||{};
  const cg=campaignGraphs(c, g.phases?{nodes:g.phases,edges:[]}:null);
  const prov=g.source==='sealed_logs'?`<p class="muted" style="margin:0 0 6px;font-size:12px">The bundle itself publishes ${g.legacy_rows?g.legacy_rows+' cell-level rows and ':''}no step grain. The steps below were read from the sealed event logs on this machine, matched to the bundle by receipt digest, so they are the runs the bundle reports on but not part of the published artefact.</p>`:'';
  const traj=c.trajectory_file?`${prov}<dl class="kv"><dt>cases</dt><dd>${g.cases}</dd><dt>steps</dt><dd>${g.rows} (${g.steps_per_case} per case)</dd><dt>phases seen</dt><dd class="mono">${esc((g.phases||[]).join(', '))}</dd><dt>profiles</dt><dd>${g.profiles} (${g.scripted_profiles} scripted) <span class="mono muted">${esc((g.profile_ids||[]).join(', '))}</span></dd><dt>invalid steps</dt><dd>${g.invalid_steps}</dd><dt>provider cost in grain</dt><dd>${money(g.cost_usd||0)}</dd></dl><div class="nav"><button class="primary" id="examine">Examine cases step by step</button></div>`:(g.legacy_rows?`<p class="muted">This bundle publishes ${g.legacy_rows} cell-level rows without a step grain, so it can be reviewed here but not stepped through.</p>`:`<p class="muted">Nothing to step through: ${esc((LENS[c.id]||{}).note||'no step grain is published for this bundle and no sealed attempt directory on this machine matches it')}.</p>`);
  const attn=c.checklist.filter(i=>i.state!=='yes').length;

  const phaseHtml=`<section class="panel"><h2>Phase graph${onePhase?` <span style="text-transform:none;letter-spacing:0;font-weight:400">· one phase, <span class="mono">${esc((cg.variants[0].nodes||[''])[0])}</span>, repeated each turn</span>`:''}</h2><p class="muted" style="font-size:12px;margin:0 0 4px">${esc(cg.note)}</p><div class="gwrap">${cg.variants.map(v=>graphCard(v)).join('')}</div></section>`;
  // checklist and the QC profile it is read against sit side by side; the incident log closes the page
  $('view').className='';
  $('view').innerHTML=`<div class="stack">${confirmatoryHtml(c)}
  <section class="panel"><h2>${esc(CAT.family_label[c.family]||c.family)} · version ${c.chain.position} of ${c.chain.length} in <span class="mono">${esc(c.stem)}</span></h2>
   <h3 class="mono" style="font-size:16px">${esc(c.id)}</h3><div class="chain">${chain}</div>${runline}
   <div class="status"><span class="chip ${c.chain.latest?'acc':''}">${c.chain.latest?'latest in chain':'earlier version'}</span> <span class="em">${esc(st.label)}</span>${c.manifest.cost_qualifier?` · cost ${esc(c.manifest.cost_qualifier)}`:''}${c.manifest.total_cost_usd!=null?` · ${money(c.manifest.total_cost_usd)}`:''}${c.source_receipts?` · ${c.source_receipts} source receipts`:''}<div class="why">${why.length?why.join('<br>'):'no status sentence found in the manifest, reports or README; treat as published with the claims stated in its README'}</div></div>
   ${c.readme.excerpt?`<details style="margin-top:6px"><summary class="muted" style="font-size:12px">README excerpt · <span class="mono">${esc(c.path)}/README.md</span></summary><p style="margin:6px 0 0;max-width:110ch">${md(c.readme.excerpt)}</p></details>`:''}
  </section>
  ${keyChartsHtml(c)}

// ---------------- graph layout (generic) ----------------
function layout(nodes,edges,entry){
  const est=t=>t.length*(t.length>30?6.3:7.1);const longest=Math.max(...nodes.map(n=>n.length));
  const wrap=longest>34;const lines=n=>{if(!wrap||n.length<=34)return [n];const cuts=[...n].map((c,i)=>c==='_'?i:-1).filter(i=>i>3&&i<n.length-4);const mid=n.length/2;const cut=cuts.length?cuts.reduce((b,i)=>Math.abs(i-mid)<Math.abs(b-mid)?i:b):Math.floor(mid)-1;return [n.slice(0,cut+1),n.slice(cut+1)];};
  const widest=Math.max(...nodes.flatMap(n=>lines(n).map(est)));const NODE_W=Math.max(150,Math.min(300,Math.round(widest)+22)),NODE_H=wrap?60:46,GX=56,GY=20;
  const stackLike=nodes.length>=6&&nodes.every(n=>/_(offer|response|commit)$/.test(n));
  const pos={};let W,H;
  if(stackLike){
    const keyOf=id=>id.split('_').slice(0,-2).join('_')||id.split('_')[0]; const order=[];nodes.forEach(n=>{const k=keyOf(n);if(!order.includes(k))order.push(k);});
    const rows={offer:0,response:1,commit:2};
    nodes.forEach(n=>{const kind=n.split('_').pop();pos[n]=[30+order.indexOf(keyOf(n))*(NODE_W+GX),30+(rows[kind]||0)*(NODE_H+44)];});
    W=30+order.length*(NODE_W+GX)-GX+40;H=30+3*(NODE_H+44)+10;
  } else if(nodes.length>=3&&nodes.length<=6&&(()=>{const nxt={};nodes.forEach(n=>nxt[n]=new Set());edges.forEach(e=>{if(nxt[e.from]&&e.to!==e.from)nxt[e.from].add(e.to);});let cur=entry&&nodes.includes(entry)?entry:nodes[0];const seen=[cur];for(let i=1;i<nodes.length;i++){const outs=[...nxt[cur]].filter(n=>!seen.includes(n));if(outs.length!==1)return false;cur=outs[0];seen.push(cur);}return nxt[cur].has(seen[0]);})()){
    // a simple cycle: walk it, first half down the left column, second half up the right
    const nxt={};nodes.forEach(n=>nxt[n]=new Set());edges.forEach(e=>{if(nxt[e.from]&&e.to!==e.from)nxt[e.from].add(e.to);});
    let cur=entry&&nodes.includes(entry)?entry:nodes[0];const order=[cur];for(let i=1;i<nodes.length;i++){cur=[...nxt[cur]].filter(n=>!order.includes(n))[0];order.push(cur);}
    const half=Math.ceil(order.length/2);
    order.forEach((n,i)=>{const col=i<half?0:1;const row=i<half?i:(order.length-1-i);pos[n]=[30+col*(NODE_W+GX+30),30+row*(NODE_H+40)];});
    W=30+2*(NODE_W+GX+30)-GX-30+40;H=30+half*(NODE_H+40)+10;
  } else {
    const nxt={};nodes.forEach(n=>nxt[n]=[]);edges.forEach(e=>{if(nxt[e.from]&&nodes.includes(e.to))nxt[e.from].push(e.to);});
    const depth={};const start=entry&&nodes.includes(entry)?entry:nodes[0];depth[start]=0;const q=[start];
    while(q.length){const u=q.shift();nxt[u].forEach(v=>{if(depth[v]==null){depth[v]=depth[u]+1;q.push(v);}});}
    nodes.forEach(n=>{if(depth[n]==null)depth[n]=Math.max(0,...Object.values(depth))+1;});
    const byLayer={};nodes.forEach(n=>{(byLayer[depth[n]]=byLayer[depth[n]]||[]).push(n);});
    const ncols=Math.max(...Object.keys(byLayer).map(Number))+1,nrows=Math.max(...Object.values(byLayer).map(a=>a.length));
    W=30+ncols*(NODE_W+GX)-GX+40;H=50+nrows*(NODE_H+GY)-GY+60;
    Object.entries(byLayer).forEach(([col,list])=>{const total=list.length*(NODE_H+GY)-GY;const y0=50+(nrows*(NODE_H+GY)-GY-total)/2;list.forEach((n,i)=>pos[n]=[30+Number(col)*(NODE_W+GX),y0+i*(NODE_H+GY)]);});
  }
  return {pos,W,H,NODE_W,NODE_H,lines,est};
}
function graphSvg(graph,current,round,modes,actors){
  const {pos,W,H,NODE_W,NODE_H,lines,est}=layout(graph.nodes,graph.edges,graph.entry);
  let s=`<svg viewBox="0 0 ${W} ${Math.max(H,140)}" width="${Math.min(W, 1400)}" role="img" aria-label="phase graph, current phase ${esc(current)}"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>`;
  let back=0;
  graph.edges.forEach(e=>{if(!pos[e.from]||!pos[e.to])return;const [ax,ay]=pos[e.from],[bx,by]=pos[e.to];
    if(e.from===e.to){const cx=ax+NODE_W/2;s+=`<path d="M${cx+16},${ay} C${cx+36},${ay-40} ${cx-36},${ay-40} ${cx-16},${ay}" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>`;return;}
    if(bx>ax){s+=`<line x1="${ax+NODE_W}" y1="${ay+NODE_H/2}" x2="${bx-2}" y2="${by+NODE_H/2}" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>`;}
    else if(bx===ax){const dir=by>ay?1:-1;const off=dir>0?-14:14;s+=`<line x1="${ax+NODE_W/2+off}" y1="${dir>0?ay+NODE_H:ay}" x2="${bx+NODE_W/2+off}" y2="${dir>0?by-2:by+NODE_H+2}" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>`;}
    else if(by===ay){s+=`<line x1="${ax}" y1="${ay+NODE_H/2}" x2="${bx+NODE_W+2}" y2="${by+NODE_H/2}" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>`;}
    else{back++;const drop=36+14*back;const x1=ax+NODE_W/2,y1=ay+NODE_H,x2=bx+NODE_W/2,y2=by+NODE_H+2,base=Math.max(y1,y2)+drop;s+=`<path d="M${x1},${y1} C${x1},${base} ${x2},${base} ${x2},${y2}" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>`;}
  });
  graph.nodes.forEach(n=>{const [x,y]=pos[n];const on=n===current;const sim=(modes||{})[n]==='simultaneous';
    s+=`<rect x="${x}" y="${y}" width="${NODE_W}" height="${NODE_H}" rx="6" fill="${on?'var(--accent)':'var(--panel)'}" stroke="${on?'var(--accent)':'currentColor'}" stroke-width="1.3"/>`;
    if(sim)s+=`<rect x="${x+4}" y="${y+4}" width="${NODE_W-8}" height="${NODE_H-8}" rx="4" fill="none" stroke="${on?'var(--panel)':'currentColor'}" stroke-width=".8" opacity=".8"/>`;
    const ls=lines(n);const fs=ls.some(l=>l.length>30)?10:11.5;const lh=fs+2;const top=y+(NODE_H-11-ls.length*lh)/2+fs;
    ls.forEach((l,li)=>{const fit=est(l)>NODE_W-10?` textLength="${NODE_W-10}" lengthAdjust="spacingAndGlyphs"`:'';s+=`<text class="lab" x="${x+NODE_W/2}" y="${top+li*lh}" text-anchor="middle" font-size="${fs}"${fit} fill="${on?'var(--panel)':'currentColor'}">${esc(l)}</text>`;});
    const sub=(actors||{})[n]?String((actors||{})[n]):'';if(sub)s+=`<text class="sub" x="${x+NODE_W/2}" y="${y+NODE_H-11}" text-anchor="middle" font-size="10" fill="${on?'var(--panel)':'var(--muted)'}">${esc(sub.length>26?sub.slice(0,25)+'…':sub)}</text>`;});
  if(round!=null)s+=`<text x="${W-10}" y="${Math.max(H,140)-8}" text-anchor="end" font-size="11" fill="var(--muted)">round ${round}</text>`;
  return '<div class="gscroll">'+s+'</svg></div>';
}
function pickGraph(c,observed){
  const pkg={datacenter_development_terms:'datacenter_development_terms'}[c.family]||c.family;
  const decl=(CAT.declared_graphs||{})[pkg]||[];
  const obsNodes=new Set(observed.nodes);
  const match=bestDeclared(c,decl,observed.nodes);
  if(match) return {graph:{nodes:match.nodes,edges:match.edges,entry:match.nodes[0],basis:`declared by ${match.plugin}${match.variant?' ('+match.variant+')':''}`},modes:match.modes,actors:match.actors};
  return {graph:{...observed,basis:observed.basis||'observed transitions (no declared graph)'},modes:{},actors:{}};
}

let CARDS;async function loadCards(){if(CARDS===undefined){try{CARDS=await getJSON('data/case_cards.json');}catch(e){CARDS=null;}}return CARDS;}
function cardFor(k){if(!CARDS)return null;const ev=CARDS.evaluations[k.receipt_sha256]||null;let id=ev&&ev.world_case_id;if(!id)id=Object.keys(CARDS.cards).find(c=>String(k.case_id||'').startsWith(c));return id?{card:CARDS.cards[id],ev}:null;}
function proseHtml(sec){if(!sec)return'';return (sec.paragraphs||[]).map(x=>`<p style="font-size:12.5px;margin:4px 0">${md(x)}</p>`).join('')+((sec.bullets||[]).length?`<ul style="margin:4px 0;padding-left:18px;font-size:12.5px">${sec.bullets.map(b=>`<li>${md(b)}</li>`).join('')}</ul>`:'');}
function cardHtml(k){const f=cardFor(k);if(!f)return'';const {card,ev}=f;
 const part=id=>{const v=card.buyer_sees[id];return v?(v.component.startsWith('esp32')?'ESP32':'OLED'):'';};const lab=id=>`${part(id)} ${id.split('_').pop()}`;
 const pct=x=>(x*100).toFixed(x<0.1?1:0)+'%';const m=card.metadata||{};const dif=m.difficulty||{};const pr=CARDS.prompts&&CARDS.prompts[card.pack];
 const stratum=CARDS.strata[card.stratum.replace(/_/g,'-')]||{};const decision=(stratum.bullets||[]).find(b=>/^\*\*Decision/.test(b))||'';
 // 0. metadata (task.toml / mercor.json)
 const meta=`<div class="ccmeta">${[['category',m.category],['domain',m.domain],['split',m.split],['pack',m.pack],['world seed',m.world_seed],['budget',m.budget],['scorer',m.scorer],['prompt',pr?pr.prompt_id:'']].filter(x=>x[1]!=null&&x[1]!=='').map(([a,b])=>`<span class="chip"><span class="muted">${esc(a)}</span> ${esc(b)}</span>`).join(' ')} <span class="chip" title="not rated by a human; the regret of three reference policies on this world"><span class="muted">difficulty</span> myopic ${fmt(dif.myopic_regret_usd,1)} · deadline_aware ${fmt(dif.deadline_aware_regret_usd,1)} · defer ${fmt(dif.defer_regret_usd,1)}</span></div>
  ${decision?`<p class="ccwhy">${md(decision.replace(/^\*\*Decision:\*\*\s*/,'**Tests:** '))} <details class="jd" style="display:inline"><summary>stratum notes</summary>${proseHtml(stratum)}</details></p>`:''}`;
 // 1. instruction (instruction.md): what the buyer is told and shown
 const seen=Object.keys(card.buyer_sees).map(id=>{const v=card.buyer_sees[id];return `<tr><td class="nw">${esc(lab(id))}</td><td class="nw mono">$${Number(v.displayed_unit_price_usd).toFixed(3)}</td><td class="nw">${esc(v.claimed_lead_time_days)} days</td><td>${esc(v.claimed_variant||'')}</td><td class="muted">${esc(String(v.evidence_status||'').replace(/_/g,' '))}</td></tr>`;}).join('');
 const instr=`<h3>1 · Instruction <span class="muted">what the buyer is told and shown</span></h3><p class="cctext">${esc(card.description||'')}</p>
  <table class="cct"><thead><tr><th>supplier</th><th>listed price</th><th>claimed lead</th><th>claimed variant</th><th>status</th></tr></thead><tbody>${seen}</tbody></table>
  ${pr?`<details class="jd"><summary>Prompt, verbatim · <span class="mono">${esc(pr.prompt_id)}</span> · ${esc(pr.sha256.slice(0,12))}</summary><pre class="ccpre">${esc(pr.text)}</pre></details>`:''}`;
 // 2. environment (task files / hidden state)
 const hid=Object.keys(card.hidden_from_buyer).map(id=>{const h=card.hidden_from_buyer[id],r=h.relationship||{};const rel=[r.loyalty_discount_per_award?`loyalty ${pct(r.loyalty_discount_per_award)}/award, cap ${pct(r.loyalty_discount_cap)}`:'',r.retaliation_markup?`retaliates ${pct(r.retaliation_markup)}`:'',r.incumbent_capacity_bonus?`+${r.incumbent_capacity_bonus} capacity as incumbent`:''].filter(Boolean).join('; ')||'none';
  return `<tr><td class="nw">${esc(lab(id))}</td><td class="nw mono">$${h.base_quoted_unit_price_usd.toFixed(3)}</td><td class="nw mono">$${h.base_floor_unit_price_usd.toFixed(3)}</td><td class="nw">${h.capacity} · MOQ ${h.moq}</td><td class="nw">${h.lead_time_days} days</td><td class="nw">${pct(h.on_time_probability)}</td><td class="nw">${pct(h.verified_yield_rate)}</td><td class="nw">$${h.sample_cost_usd} · ${h.sample_lead_time_days}d</td><td>${esc(rel)}</td></tr>`;}).join('');
 const env=`<h3>2 · Environment <span class="muted">hidden from the buyer</span></h3><table class="cct"><thead><tr><th>supplier</th><th>quote</th><th>floor</th><th>capacity</th><th>lead</th><th>on time</th><th>yield</th><th>sample</th><th>relationship</th></tr></thead><tbody>${hid}</tbody></table>`;
 // 3. reference solution (solve.sh / expert steps + oracle)
 const steps=(card.reference_solution.expert_steps||[]).map(x=>`<li>${esc(x)}</li>`).join('');
 const plan=card.reference_solution.per_period.map(pp=>{const mine=ev&&ev.periods.find(x=>x.period===pp.period);const ref=pp.lines.map(l=>`${lab(l.supplier_id)} $${l.paid_unit_price_usd.toFixed(3)}`).join(' + ');const got=mine?(mine.suppliers.length?mine.suppliers.map(sid=>`${lab(sid)} $${Number(mine.prices[sid]||0).toFixed(3)}`).join(' + '):mine.decision):'—';const same=mine&&JSON.stringify(mine.suppliers)===JSON.stringify(pp.suppliers);return `<tr><td class="nw">${pp.period}</td><td class="mono">${esc(ref)}</td><td class="mono ${mine&&!same?'neg':''}">${esc(got)}</td><td class="nw">${fmt(pp.margin_usd,2)}</td></tr>`;}).join('');
 const sol=`<h3>3 · Reference solution <span class="muted">expert steps</span></h3><ol class="ccol">${steps}</ol><p class="muted cctext">Oracle: ${esc(card.reference_solution.oracle||'')}.</p>
  <table class="cct"><thead><tr><th>period</th><th>reference buys</th><th>this cell buys</th><th>ref. margin</th></tr></thead><tbody>${plan}</tbody></table>`;
 // 4. verifier (rubric: criterion, negative criterion, skill tag) and the score
 const crit=card.diagnostic_checks.map(c=>{const id=c.id.slice(0,2);const r=ev&&ev.checks[id];const cls=r?(r.verdict==='pass'?'yes':r.verdict==='fail'?'no':'na'):'na';return `<tr><td class="nw mono">${esc(id)}</td><td>${esc(c.criterion||c.check)}</td><td class="muted">${esc(c.negative_criterion||c.fails_when)}</td><td class="nw">${esc(c.skill_tag||'')}</td><td class="nw"><button class="chip ${cls}" data-cell="${esc(k.receipt_sha256||(k.cell_id+'|'+k.episode_attempt_id))}" data-focus="${esc(id)}" title="what this result rests on">${esc(r?r.verdict:'not evaluated')} ›</button></td><td class="muted">${esc(r?r.why:'')}</td></tr>`;}).join('');
 const lad=Object.entries(card.reference_ladder_regret_usd).concat(ev?[['this cell',ev.regret]]:[]).sort((a,b)=>a[1]-b[1]).map(([n,v])=>`<button class="chip ${n==='this cell'?'acc':''}" data-ladder="${esc(n)}" title="${esc(gloss(n))} · click for the ladder">${esc(n)} ${fmt(v,1)}</button>`).join(' ');
 const ver=`<h3>4 · Verifier <span class="muted">rubric and score for this cell</span></h3><table class="cct"><thead><tr><th>#</th><th>criterion</th><th>negative criterion</th><th>skill</th><th>result</th><th>evidence</th></tr></thead><tbody>${crit}</tbody></table>
  <p class="cctext" style="margin-top:8px"><strong>Score:</strong> regret to the exact bound, lower is better. Criteria diagnose; they do not score.</p><div style="display:flex;flex-wrap:wrap;gap:4px">${lad}</div>`;
 return `<section class="panel cc" style="margin-bottom:10px"><details open><summary>Case card · ${esc(card.stratum.replace(/_/g,' '))} · <span class="mono">${esc(card.world)}</span></summary>${meta}
  <div class="ccgrid"><div>${instr}${env}</div><div>${sol}</div></div><div>${ver}</div>
  <p class="muted" style="font-size:11.5px;margin:8px 0 0">Generated from <span class="mono">${esc(card.stratum_card.split('#')[0])}</span> and the world card; layout after Terminal-Bench and APEX (instruction · metadata · solution · verifier).</p></details></section>`;}
// ---------------- case cards for every family (Terminal-Bench / APEX layout) ----------------
// The procurement repeated-sourcing worlds have authored cards (cardHtml). Every
// other sealed case gets the same four parts from what the lens already holds:
// the prompt and first observation (instruction), what the world defines that
// the seat never saw (environment), the reference values the family publishes
// (reference) and the scorer's own rubric where the world carries one
// (verifier). An adapter is chosen by the world's shape, not by name, and a part
// the family does not define is said to be missing rather than invented.
function lensFirstAction(lc){for(const p of lc.phases||[])for(const a of p.actions||[])return a;return null;}
function lensLastParsed(lc){let out=null;(lc.phases||[]).forEach(p=>(p.actions||[]).forEach(a=>{if(a.parsed&&a.parsed.action)out=a.parsed.action;}));return out;}
const chipRow=items=>`<div class="ccmeta">${items.filter(x=>x[1]!=null&&x[1]!=='').map(([a,b,tip])=>`<span class="chip"${tip?` title="${esc(tip)}"`:''}><span class="muted">${esc(a)}</span> ${esc(b)}</span>`).join(' ')}</div>`;
const verdictChip=v=>`<span class="chip ${v==='pass'?'yes':v==='fail'?'no':'na'}">${esc(v)}</span>`; // 'recorded' and 'not evaluated' render neutral
// each result opens the rubric row's details page (what it read, the values compared, the step that decided it)
const verdictBtn=(v,attrs)=>`<button class="chip ${v==='pass'?'yes':v==='fail'?'no':'na'}" ${attrs} title="what this result rests on">${esc(v)} ›</button>`;
function rubricTable(rows,cur){if(!rows.length)return '';return `<table class="cct"><thead><tr><th>#</th><th>criterion</th><th>negative criterion</th><th>component</th><th>result</th><th>evidence</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${cur&&r.id===cur?'hl':''}"><td class="nw mono">${esc(r.id||('C'+(i+1)))}</td><td>${md(r.criterion)}</td><td class="muted">${md(r.negative||'')}</td><td class="nw">${esc(r.component||'')}</td><td class="nw">${verdictBtn(r.result||'not evaluated',`data-rubric="${esc(r.id||('C'+(i+1)))}"`)}</td><td class="muted">${md(r.evidence||'')}</td></tr>`).join('')}</tbody></table>`;}

let CB;async function loadCB(){if(CB===undefined){try{CB=await getJSON('data/contract_builder.json');CB._w={};CB.data.worlds.forEach(w=>{CB._w[w.id]=w;});CB._ix={};Object.entries(CB.data.menus).forEach(([pb,rows])=>{CB._ix[pb]=new Map(rows.map((r,i)=>[r.map(String).join('|'),i]));});}catch(e){CB=null;}}return CB;}
const cbWorldOf=caseId=>CB&&String(caseId||'').startsWith(CB.case_prefix)?CB._w[String(caseId).slice(CB.case_prefix.length)]||null:null;
const cbRuns=c=>!!(CB&&c&&CB.campaigns.includes(c.id));
const cbK=x=>x==null||isNaN(x)?'n/a':`$${fmt(Math.abs(x)<0.05?0:x,1)}k`;
const cbPct=p=>p>=0.1?(p*100).toFixed(1)+'%':(p*100).toFixed(2)+'%';
const cbRow=(pb,i)=>Object.fromEntries(CB.data.terms.map((k,j)=>[k,String(CB.data.menus[pb][i][j])]));
const CB_LEVEL={warranty:v=>({none:'no warranty',fix:'warranty: fix',fix_and_delay:'warranty: fix + delay'}[v]||v),damages:v=>`damages $${v}k/wk`,liability_cap:v=>v==='uncapped'?'uncapped liability':`liability cap $${Number(v).toLocaleString()}k`,readiness:v=>`readiness: ${v}`,consequential:v=>`consequential loss ${v}`,deposit:v=>v==='none'?'no deposit':`deposit ${v}`,escrow:v=>v==='true'?'escrow':'',burn_in:v=>v==='true'?'burn-in':''};
// a contract's negotiable terms in words (a term the playbook fixes, or one that does not apply, is left out)
function cbTerms(c,pb){if(!CB||!c)return '';const neg=CB.data.negotiable[pb]||CB.data.terms;const v=k=>String(c[k]);return CB.data.terms.filter(k=>neg.includes(k)&&!(k==='damages'&&v('warranty')!=='fix_and_delay')&&!(k==='escrow'&&v('deposit')==='none')).map(k=>(CB_LEVEL[k]||(x=>k+' '+x))(v(k))).filter(Boolean).join(' · ')||'the base contract';}
const cbSigned=o=>o['cells.termination']!=='signed'?null:Object.fromEntries(CB.data.terms.map(t=>[t,o['cells.signed_contract.'+t]]));
const cbWho=o=>`${String(o['cells.arm']||'').replace(/_/g,' ')} · ${String(o['cells.route_id']||'').replace(/_/g,' ')}`;
function cbTabHtml(c){const p=(CB.parity||{})[c.id]||{};const bad=(p.mismatches||[]).length;
 return `<p class="muted" style="margin:0 0 6px;font-size:12.5px">Every world of the full-terms pack (${CB.data.worlds.length}), priced by the grader's own solver (<span class="mono">${esc(String(CB.source.module).split('.').pop())}</span> at <span class="mono">${esc(String(CB.source.commit).slice(0,8))}</span>): pick a world and set any term to see what the integrator would charge and what the client would carry. To check a cell, choose one of this run's cells on the world in the table below: the builder loads the contract it signed and recomputes its realised cost and its cost over the best attainable beside the grader's numbers.${p.checked!=null?` At build time ${p.reproduced} of the run's ${p.checked} graded cells reproduced the grader to $0.05k${bad?`; ${bad} did not`:''}${p.cells>p.checked?` (${p.cells-p.checked} cells have no grade)`:''}.`:''}</p><div id="cbcells"></div><iframe id="cbframe" title="Contract builder" style="width:100%;height:1400px;border:1px solid var(--rule);border-radius:8px;background:var(--panel);display:block;margin-top:8px"></iframe>`;}
let CB_FRAME=null,CB_RUN=null;
window.addEventListener('message',e=>{if(!CB_FRAME||!CB_FRAME.isConnected||e.source!==CB_FRAME.contentWindow)return;const m=e.data||{};
 if(m.cbHeight)CB_FRAME.style.height=Math.max(600,m.cbHeight+8)+'px';
 if(m.cbWorld){route.cb=Object.assign({},route.cb,{world:m.cbWorld});if(route.cb.cell&&!String(route.cb.cellWorld||'').includes(m.cbWorld))route.cb.cell=null;save();cbCells(CB_RUN,m.cbWorld);}});
function cbMount(el,c){const f=el.querySelector('#cbframe');if(!f)return;CB_FRAME=f;CB_RUN=c;const init=route.cb||{};

async function cbCells(c,wid){const box=$('cbcells');if(!box||!c)return;const data=campaignCache[c.id]||(campaignCache[c.id]=await getJSON(c.trajectory_file));let lens=null;try{lens=await loadLens(c);}catch(e){}

 const cur=(route.cb||{}).cell;const O=k=>k.outcome_row||{};const ks=data.cases.filter(k=>k.case_id===CB.case_prefix+wid).sort((a,b)=>String(O(a)['cells.cell_key']).localeCompare(String(O(b)['cells.cell_key'])));
 const ended=o=>o['cells.decision_regret']==null?`<span class="chip no">${esc(String(o['cells.failure_cause']||o['cells.status']||'not graded').replace(/_/g,' '))}</span>`:o['cells.termination']==='signed'?`signed ${esc(cbTerms(cbSigned(o),W.playbook))}${o['cells.signed_best_contract']?' <span class="chip yes">a best contract</span>':''}`:`walked to ${esc(String(o['cells.walked_to']).replace(/_/g,' '))}`;
 box.innerHTML=`<div class="scroll"><table class="cct"><thead><tr><th>this run's cells on world <span class="mono">${esc(wid)}</span> · ${esc(String(W.cell).replace(/_/g,' '))} · ${esc(W.playbook)}</th><th>seed</th><th>how it ended</th><th>decision regret</th><th>cost over best attainable</th><th></th></tr></thead><tbody>${ks.map(k=>{const o=O(k);const on=k.receipt_sha256===cur;return `<tr class="${on?'hl':''}"><td class="mono nw">${esc(cbWho(o))}</td><td class="mono">${esc(o['cells.replicate_index'])}</td><td>${ended(o)}</td><td class="mono">${o['cells.decision_regret']==null?'—':fmt(o['cells.decision_regret'],1)}</td><td class="mono">${o['cells.cost_over_best_attainable']==null?'—':fmt(o['cells.cost_over_best_attainable'],1)}</td><td class="nw">${o['cells.realised_cost']!=null?`<button class="dbtn ${on?'att':''}" data-cbcell="${esc(k.receipt_sha256)}">${on?'checked below':'check in the builder ›'}</button>`:''}${stepable.has(k.receipt_sha256)?` <button class="dbtn" data-cbstep="${esc(k.receipt_sha256)}">case card ›</button>`:''}</td></tr>`;}).join('')||'<tr><td colspan="6" class="muted">no cell of this run is on this world</td></tr>'}</tbody></table></div>`;

 box.querySelectorAll('[data-cbstep]').forEach(b=>b.addEventListener('click',()=>{route.view='step';route.caseId=b.dataset.cbstep;route.step=0;render();}));}
async function cbLoadCell(c,rec){const data=campaignCache[c.id]||(campaignCache[c.id]=await getJSON(c.trajectory_file));const k=data.cases.find(x=>x.receipt_sha256===rec);if(!k||!CB_FRAME)return;const o=k.outcome_row||{};const wid=String(k.case_id).slice(CB.case_prefix.length);
 let decisions=null;try{const lens=await loadLens(c);const lc=lens&&lens.cases.find(x=>x.receipt_sha256===rec);decisions=(lc&&lc.outcome&&lc.outcome.grade&&lc.outcome.grade.decisions)||null;}catch(e){}
 const split={};['contract','price','walk','refused_counters'].forEach(p=>{if(o['cells.split.'+p]!=null)split[p]=o['cells.split.'+p];});
 route.cb=Object.assign({},route.cb,{cellWorld:wid});
 CB_FRAME.contentWindow.postMessage({cbCell:{world:wid,label:`${cbWho(o)} · seed ${o['cells.replicate_index']} · ${o['cells.termination']==='signed'?'signed':'walked to '+String(o['cells.walked_to']).replace(/_/g,' ')} · receipt ${rec.slice(0,10)}`,signed:cbSigned(o),walked_to:o['cells.walked_to'],refused:o['cells.refused_counters']||0,price_over_floor:o['cells.price_over_floor'],decisions,grade:{realised_cost:o['cells.realised_cost'],cost_over_best_attainable:o['cells.cost_over_best_attainable'],decision_regret:o['cells.decision_regret'],split}}},'*');}
const CARD_ADAPTERS=[
 {id:'report',match:w=>w&&w.oracle&&w.public_case,
  instruction:(w)=>{const pc=w.public_case;const obs=(pc.observations||[]).map(o=>`<tr><td class="nw mono">${esc(o.evidence_id||'')}</td><td class="nw">${esc(String(o.kind||'').replace(/_/g,' '))}</td><td>${esc(o.content||'')}</td></tr>`).join('');
   return `${pc.prompt?`<p class="cctext">${md(pc.prompt)}</p>`:''}${obs?`<table class="cct"><thead><tr><th>evidence</th><th>kind</th><th>what the seat is shown</th></tr></thead><tbody>${obs}</tbody></table>`:''}${pc.authority?`<p class="muted cctext">Authority: ${esc(pc.authority.mode||'')}; external actions ${pc.authority.external_actions_authorized?'authorised':'not authorised'}.</p>`:''}`;},
  hidden:w=>w.oracle,
  reference:(w,sc)=>{const g=w.oracle.gold||{};return {rows:[['states',g.states],['amounts',g.amounts],['required actions',g.required_actions],['required claims',g.required_claims],['required evidence',g.required_evidence_ids],['amount tolerance (absolute)',g.amount_tolerance]].filter(x=>x[1]!=null),note:w.oracle.terminal_when?`Done when: ${w.oracle.terminal_when}`:''};},
  rubric:(w,lc)=>{const g=w.oracle.gold||{};const r=lensLastParsed(lc)||{};const acts=new Set(r.actions||[]),claims=new Set(r.claims||[]),ev=new Set(r.evidence_ids||[]);const rows=[];
   Object.entries(g.states||{}).forEach(([k,v])=>{const got=(r.states||{})[k];rows.push({id:'S',criterion:`States \`${k}\` as \`${v}\``,negative:'any other value',component:'state accuracy',result:got===undefined?'fail':got===v?'pass':'fail',evidence:got===undefined?'not stated':`stated \`${got}\``,src:`\`states.${k}\` in the last parsed report, against \`oracle.gold.states.${k}\``,at:'report',vals:{expected:v,reported:got===undefined?null:got}});});

   (g.required_actions||[]).forEach(a=>rows.push({id:'R',criterion:`Takes action \`${a}\``,negative:'omits it',component:'action recall',result:acts.has(a)?'pass':'fail',src:'`actions` in the last parsed report',at:'report',vals:{required:a,reported_actions:r.actions||[]}}));
   (g.required_claims||[]).forEach(a=>rows.push({id:'C',criterion:`Claims \`${a}\``,negative:'omits it',component:'claim recall',result:claims.has(a)?'pass':'fail',src:'`claims` in the last parsed report',at:'report',vals:{required:a,reported_claims:r.claims||[]}}));

const GLOSS={"award":"A cell's decision: its last period ended with a submitted award, so the episode ran to the end. Earlier periods may still have breached.","failed":"A cell's decision: the episode stopped before its last period, usually on an invalid or malformed action; the periods left are unplayed and earn nothing.","unplayed":"A period that never ran because the episode had already stopped.","decision":"How a cell or a period ended: award, defer, failed or unplayed.",

 'loyal':'A full-information buyer that keeps its first-period suppliers for every period.',
 'shopping':'A full-information buyer that re-picks the cheapest supplier every period.',
 'deadline_aware':'A simple rule that sees only what the buyer sees: it qualifies suppliers while delivery is still possible and orders the target quantity. The bar a model should clear.',
 'defer':'Orders nothing and earns $0, so its regret is the whole upper bound.',

// ---------------- every table sorts by any column ----------------
// A click on a column header sorts the table's rows by that column: numbers as numbers (a leading sign, $ or
// thousands commas allowed; "0 · 2" sorts by its first number), text in natural order, blanks and dashes last in
// either direction. Numbers start largest first, text A to Z; a second click reverses, a third restores the page's
// own order. A group header row (a chain of versions, a comparison set) keeps its rows under it and they sort
// within it; a pooled or total row stays at the end of its group; a row spanning the whole table that follows a
// row (its details) moves with that row. The choice is kept per table layout for this visit, so a table that a
// re-render rebuilds comes back sorted the same way. A header holding its own control (a button, a menu) is left
// to that control.
const SORTS={};const sortColl=new Intl.Collator(undefined,{numeric:true,sensitivity:'base'});
function sortCells(tr){const out=[];let c=0;[...tr.cells].forEach(td=>{const n=td.colSpan||1;out.push({td,c,n});c+=n;});return {cells:out,span:c};}
function sortKey(td){if(!td)return null;const d=td.dataset.sort;const t=(d!=null&&d!==''?d:td.textContent).replace(/\s+/g,' ').trim();
 if(!t||/^(—|–|-|n\/a|na|none|null|not stated|\?)$/i.test(t))return null;
 const m=t.replace(/[−–](?=\s*[$\d.])/g,'-').replace(/(\d),(?=\d{3}\b)/g,'$1').match(/^[~≈<>≤≥]?\s*([+-])?\s*\$?\s*([+-])?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i);
 if(m){const v=parseFloat(m[3]+(m[4]||''));return {n:(m[1]==='-'||m[2]==='-')?-v:v,t};}return {t};}
function sortHead(table){const tr=table.tHead&&table.tHead.rows[table.tHead.rows.length-1];return tr?sortCells(tr):null;}
function sortSig(table){const h=sortHead(table);return h?h.cells.map(x=>x.td.dataset.label||x.td.textContent.replace(/[▲▼⇅]/g,'').trim()).join('|')+'#'+h.span:'';}
// The body as groups of blocks; a block is a row plus the rows that ride with it. A comparison-set header (mcgrp)
// starts a group its rows sort within, since they are read under it; a version-chain header (grp) only gathers
// rows that name themselves, so a sorted table lists every run by the column and hides the chain headers.
function sortBlocks(table,span){const groups=[];let g={head:null,blocks:[],tail:[],flat:[]};groups.push(g);const flat=[];
 [...table.tBodies].forEach(tb=>[...tb.rows].forEach(tr=>{const {span:s,cells}=sortCells(tr);const full=cells.length===1&&s>=span&&span>1;
  if(/\bgrp\b/.test(tr.className)){flat.push(tr);return;}
  if(/\bmcgrp\b/.test(tr.className)){g={head:tr,blocks:[],tail:[],tb};groups.push(g);return;}
  if(/\b(mcpool|total|pin)\b/.test(tr.className)){g.tail.push(tr);return;}
  if(full&&g.blocks.length){g.blocks[g.blocks.length-1].rows.push(tr);return;}
  if(s!==span||[...tr.cells].some(td=>td.rowSpan>1))g.bad=true;
  g.blocks.push({rows:[tr],cells,tb});}));groups.flat=flat;return groups;}
function sortApply(table,col,dir){const h=sortHead(table);if(!h)return false;const tbs=[...table.tBodies];
 if(!table._sortOrig)table._sortOrig=tbs.map(tb=>[...tb.rows]);
 tbs.forEach((tb,i)=>table._sortOrig[i].forEach(r=>{tb.appendChild(r);if(/\bgrp\b/.test(r.className))r.hidden=false;}));
 if(dir){const groups=sortBlocks(table,h.span);if(groups.some(g=>g.bad))return false;groups.flat.forEach(r=>{r.hidden=true;});
  groups.forEach(g=>{const keyed=g.blocks.map((b,i)=>{const x=b.cells.find(c=>c.c<=col&&col<c.c+c.n);return {b,i,k:x?sortKey(x.td):null};});
   const known=keyed.filter(x=>x.k);const numeric=known.length&&known.filter(x=>x.k.n!=null).length>=0.7*known.length;
   keyed.sort((a,b)=>{if(!a.k||!b.k)return (!a.k)-(!b.k)||a.i-b.i;const an=a.k.n!=null,bn=b.k.n!=null;
    if(numeric&&an!==bn)return an?-1:1;const r=numeric&&an?a.k.n-b.k.n:sortColl.compare(a.k.t,b.k.t);return (dir==='desc'?-r:r)||a.i-b.i;});
   const frag=document.createDocumentFragment();keyed.forEach(x=>x.b.rows.forEach(r=>frag.appendChild(r)));g.tail.forEach(r=>frag.appendChild(r));
   const tb=g.tb||(g.blocks[0]&&g.blocks[0].tb)||tbs[0];if(g.head)g.head.parentNode.insertBefore(frag,g.head.nextSibling);else if(tb)tb.insertBefore(frag,tb.firstChild);});}

 return true;}
function sortEnhance(root){(root||document).querySelectorAll('table:not([data-sortable])').forEach(table=>{const h=sortHead(table);table.dataset.sortable='';if(!h||!table.tBodies.length)return;
 if(sortBlocks(table,h.span).some(g=>g.bad)){table.dataset.sortable='no';return;}
 h.cells.forEach(x=>{if(x.td.querySelector('button,select,input,a'))return;x.td.classList.add('srt');x.td.dataset.col=x.c;x.td.insertAdjacentHTML('beforeend','<span class="sortind"></span>');
  if(!/click to sort/.test(x.td.title||''))x.td.title=(x.td.title?x.td.title+' ':'')+'(click to sort)';});
 const st=SORTS[sortSig(table)];if(st)sortApply(table,st.col,st.dir);});}
document.addEventListener('click',e=>{const th=e.target.closest&&e.target.closest('th.srt');if(!th||e.target.closest('button,select,input,a'))return;const table=th.closest('table');if(!table||table.dataset.sortable==='no')return;
 const col=Number(th.dataset.col),sig=sortSig(table),cur=SORTS[sig];const keys=[...table.tBodies].flatMap(tb=>[...tb.rows]).map(tr=>{const x=sortCells(tr).cells.find(c=>c.c<=col&&col<c.c+c.n);return x?sortKey(x.td):null;}).filter(Boolean);
 const first=keys.length&&keys.filter(k=>k.n!=null).length>=0.7*keys.length?'desc':'asc';const next=!cur||cur.col!==col?first:cur.dir===first?(first==='asc'?'desc':'asc'):null;

  const all=rows.flatMap(rw=>rw.vals.flatMap(v=>[v.m,v.lo,v.hi,...v.dots])).filter(v=>v!=null&&!isNaN(v));let lo=Math.min(0,...all),hi=Math.max(0,...all);const pad=(hi-lo)*.06||1;lo-=pad;hi+=pad;
  const W=760,labW=230,ns=b.series.length,bh=ns>1?9:13,rowH=ns>1?30:24,top=18,H=top+rows.length*rowH+24;const X=v=>labW+(W-labW-(ns>1?170:80))*(v-lo)/(hi-lo);
  let g=niceTicks(lo,hi,6).map(v=>`<line x1="${X(v)}" x2="${X(v)}" y1="${top-4}" y2="${H-20}" stroke="var(--rule)" stroke-width="${v===0?1.8:1}"/><text x="${X(v)}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(b.f===pp?(v*100).toFixed(0)+' pp':fmtTick(v))}</text>`).join('');
  rows.forEach((rw,i)=>{const y0=top+i*rowH;if(i===1)g+=`<line x1="0" x2="${W}" y1="${y0-2}" y2="${y0-2}" stroke="var(--ink)" stroke-width=".6" opacity=".4"/>`;
   g+=`<text x="${labW-8}" y="${y0+rowH/2+4}" text-anchor="end" font-size="11.5" fill="var(--ink)" ${rw.pooled?'font-weight="600"':''}>${esc(rw.label)}${rw.n?` (${rw.n})`:''}</text>`;
   rw.vals.forEach((v,k)=>{const yy=y0+(rowH-ns*bh-(ns-1)*2)/2+k*(bh+2);const sr=b.series[k];if(v.m==null||isNaN(v.m))return;
    g+=`<rect x="${Math.min(X(0),X(v.m))}" y="${yy}" width="${Math.max(1,Math.abs(X(v.m)-X(0)))}" height="${bh}" rx="2" fill="${sr.col}" opacity="${rw.pooled?.85:.45}"><title>${esc(`${rw.label} · ${sr.label}: ${b.f(v.m)}${v.lo!=null?` (95% interval ${b.f(v.lo)} to ${b.f(v.hi)})`:''}`)}</title></rect>`;
    if(v.lo!=null)g+=`<line x1="${X(v.lo)}" x2="${X(v.hi)}" y1="${yy+bh/2}" y2="${yy+bh/2}" stroke="var(--ink)" stroke-width="1.6"/><line x1="${X(v.lo)}" x2="${X(v.lo)}" y1="${yy}" y2="${yy+bh}" stroke="var(--ink)" stroke-width="1.6"/><line x1="${X(v.hi)}" x2="${X(v.hi)}" y1="${yy}" y2="${yy+bh}" stroke="var(--ink)" stroke-width="1.6"/>`;
    v.dots.forEach(d=>{g+=`<circle cx="${X(d)}" cy="${yy+bh/2}" r="2.6" fill="var(--ink)" opacity=".55"><title>${esc(`one world: ${b.f(d)}`)}</title></circle>`;});
    g+=`<text x="${Math.max(X(0),X(v.m),v.hi!=null?X(v.hi):0,...v.dots.map(X))+7}" y="${yy+bh/2+4}" font-size="10.5" fill="var(--muted)">${esc(b.f(v.m))}${ns>1?' '+esc(sr.label):''}</text>`;});});
  return `<div style="margin:6px 0 10px"><div style="font-size:12.5px;font-weight:600">${esc(b.title)} <span class="muted" style="font-weight:400">· ${esc(b.note)}</span></div><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block" role="img" aria-label="${esc(b.title)} by world type">${g}</svg></div>`;};
 return `<div class="rcard"><div class="rhead"><span class="em">Pre-registered outcomes</span> <span class="muted">· ${esc(r.preregistration||'')}: the first bar of each chart is the published estimate over all worlds with its 95% world-bootstrap interval; the bars under it are each world type from the report’s own per-world values, each world a dot (two worlds a type, too few for an interval)</span></div>${blocks.map(chart).join('')}</div>`;}
function renderResults(c,res){
  const el=$('results');if(!el)return;
  const mcH=mcCampaignHtml(c),h=comparisonHtml(c),gh=gapHtml(c);const hasTables=!!(res&&(res.tables.length||res.intervals.length));
  const tabs=resultTabs(c);const cur=tabs.some(t=>t[0]===route.rtab)?route.rtab:tabs[0][0];
  let body;
  if(cur==='compare')body=mcH?mcH+(h?`<details class="jd" style="margin-top:10px"><summary>As the comparison report publishes it: one number pooled over the strata, and each world's bars</summary>${h}</details>`:''):h;
  else if(cur==='gap')body=gh;
  else if(cur==='builder')body=cbTabHtml(c);
  else if(!hasTables)body='<p class="muted" style="margin:0">This bundle publishes no numeric tables or interval estimates the examiner can chart.</p>';
  else{const st=resultsUI[c.id]=resultsUI[c.id]||{};
   const rank=h=>(/rate|admission|mean|delta|score|margin|npv|regret|effect|fraction|share|median|payoff/i.test(h.path)?0:1)+(/cost|ceiling|max_|count|tokens|seed|budget/i.test(h.path)?2:0);
   const head=(res.headline||[]).slice().sort((a,b)=>rank(a)-rank(b)).slice(0,8).map(h=>`<div class="tile" title="${esc(h.file+' · '+h.path)}"><div class="k">${esc(tileKey(h.path,c))}</div><div class="v">${esc(fmtNum(h.value))}</div><div class="s">${esc(tileSource(h.file))}</div></div>`).join('');
   const pre=preregBars(c);const ivs=(res.intervals||[]).filter(v=>!(pre&&/^reports\/confirmatory_vs_/.test(v.file)));const ivHtml=ivs.length?`<div class="rcard"><div class="rhead"><span class="em">Interval estimates</span> <span class="muted">· ${ivs.length} published estimate${ivs.length!==1?'s':''}: each is one number pooled over every world it covers, with its 95% interval (how many pairs and worlds, where the bundle says); amber where the interval crosses zero</span></div><div class="graph ivgrid">${intervalChart(ivs.slice(0,40),c)}</div></div>`:'';
   res.tables.forEach(t=>{t._hints=res.primary_hints||[];});
   const cards=tableGroups(res.tables).map((g,i)=>groupCard(g,i,st[i]=st[i]||{})).join('');
   const hintLine=(res.primary_hints||[]).length?`<p class="muted" style="margin:0 0 6px;font-size:12.5px">The bundle names its guarded or primary metric: <span class="mono">${esc(res.primary_hints.join(', '))}</span>. Charts open on that metric where a table carries it.</p>`:'';
   body=`<p class="muted" style="margin:0 0 6px;font-size:12.5px">Every numeric table and interval the bundle publishes, charted as published. Dots are rows; the bar is a 95% bootstrap interval of the group mean and the tick its mean (computed here, not by the bundle).</p>${hintLine}${head?`<div class="tiles" style="margin-bottom:8px">${head}</div>`:''}${pre}${ivHtml}${cards}`;}
  el.innerHTML=`<div class="tabs" style="margin:0 0 10px">${tabs.map(([k,l])=>`<button data-rt="${k}" class="${k===cur?'cur':''}">${l}</button>`).join('')}</div>${body}`;
  el.querySelectorAll('[data-rt]').forEach(b=>b.addEventListener('click',()=>{route.rtab=b.dataset.rt;save();renderResults(c,res);}));
  wireComparison(el);if(cur==='builder')cbMount(el,c);
  if(cur==='tables'&&hasTables){const st=resultsUI[c.id];el.querySelectorAll('.rcard select').forEach(sel=>sel.addEventListener('change',()=>{const i=Number(sel.closest('.rcard').dataset.i);st[i][sel.dataset.k]=sel.value;renderResults(c,res);}));}
  fitCharts();
}

// ---------------- draggable column gutters for the three-panel views ----------------
// widths the reader dragged; with none saved the CSS defaults apply, and the right column scales with the window
const COLS_KEY='aeread-examiner-cols-v2';
function savedCols(){try{const v=JSON.parse(localStorage.getItem(COLS_KEY)||'null');if(v&&v.c1)return v;}catch(e){}return null;}
// on a phone a wide chart keeps ~85% of its drawn size and scrolls in its own box, so labels stay readable
function fitCharts(){if(innerWidth>=760)return;document.querySelectorAll('#view svg').forEach(s=>{const vb=s.viewBox&&s.viewBox.baseVal;if(!vb||vb.width<=480)return;const box=s.parentElement;const avail=box.getBoundingClientRect().width;if(vb.width*0.85<=avail)return;s.style.maxWidth='none';s.style.width=Math.round(vb.width*0.85)+'px';s.style.height='auto';box.style.overflowX='auto';box.style.maxWidth='100%';});}
function wireGutters(){const grid=document.querySelector('.grid3');if(!grid||grid.querySelector('.gut'))return;const panels=[...grid.children];if(panels.length!==3)return;
  const g1=document.createElement('div'),g2=document.createElement('div');g1.className='gut';g2.className='gut';g1.title=g2.title='drag to resize · double-click to reset';panels[0].after(g1);panels[1].after(g2);
  const rc=grid.classList.contains('rc'),saved=savedCols();if(saved){grid.style.setProperty('--c1',saved.c1+'px');if(!rc&&saved.c3)grid.style.setProperty('--c3',saved.c3+'px');}if(rc)g2.classList.add('off');
  const start=(gut,which)=>e=>{if(e.button!==undefined&&e.button!==0)return;e.preventDefault();gut.classList.add('on');gut.setPointerCapture&&gut.setPointerCapture(e.pointerId);const x0=e.clientX,r=grid.getBoundingClientRect();const c1=panels[0].getBoundingClientRect().width,c3=panels[2].getBoundingClientRect().width;
    const move=ev=>{const dx=ev.clientX-x0;if(which===1){const n=Math.max(220,Math.min(r.width-c3-320,c1+dx));grid.style.setProperty('--c1',n+'px');}else{const n=Math.max(180,Math.min(r.width-c1-320,c3-dx));grid.style.setProperty('--c3',n+'px');}};
    const up=()=>{gut.classList.remove('on');window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);const v={c1:parseFloat(grid.style.getPropertyValue('--c1'))||c1,c3:rc?(saved&&saved.c3)||null:(parseFloat(grid.style.getPropertyValue('--c3'))||c3)};try{localStorage.setItem(COLS_KEY,JSON.stringify(v));}catch(err){}};
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);};
  g1.addEventListener('pointerdown',start(g1,1));g2.addEventListener('pointerdown',start(g2,2));
  [g1,g2].forEach(g=>g.addEventListener('dblclick',()=>{try{localStorage.removeItem(COLS_KEY);}catch(e){}grid.style.removeProperty('--c1');grid.style.removeProperty('--c3');}));}
// ---------------- details: every line that needs attention opens a page saying what it rests on ----------------
// data/check_details.json (build_general_examiner.py) holds, per bundle, each checklist line's rule branch, the
// values it read, related statements it did not read and the files examined with digests; plus the check
// definitions with the QC standard's own words, and every incident row in full.
let DETAILS;async function loadDetails(){if(DETAILS===undefined){try{DETAILS=await getJSON('data/check_details.json');}catch(e){DETAILS=null;}}return DETAILS;}
function openDetail(d,patch){const snap={view:route.view,campaign:route.campaign,family:route.family,caseId:route.caseId,step:route.step,detail:route.detail};route.trail=(route.trail||[]).concat([snap]).slice(-12);Object.assign(route,patch||{});route.view='detail';route.detail=d;render();}
