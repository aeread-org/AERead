</main>
<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(v){let t=esc(v);t=t.replace(/`([^`\n]+)`/g,'<code>$1</code>');t=t.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');t=t.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g,'<span class="mdlink" title="$2">$1</span>');t=t.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s.,;:)]|$)/g,'$1<em>$2</em>');return t;}
const fmt=(x,d=2)=>(x==null||isNaN(x))?'n/a':Number(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=x=>(x<0?'-':'')+'$'+fmt(Math.abs(x),x<1?4:2);
const sign=x=>x>0?'+'+fmt(x):fmt(x);
const STATE_LABEL={yes:'yes',partial:'partial',no:'no','not stated':'not stated'};
const stateCls=s=>s==='yes'?'yes':s==='partial'?'partial':s==='no'?'no':'na';
const PHASE_COLORS=['ph1','ph2','ph3','ph4','ph5','ph6','ph7','ph8'];
let CAT=null, LENS={}, RESULTS={}; const campaignCache={}, lensCache={};
function expandObj(cur,prev,prevAny){const out={};Object.entries(cur).forEach(([k,v])=>{const isO=v&&typeof v==='object'&&!Array.isArray(v);const keys=isO?Object.keys(v):[];if(isO&&v.$p===1&&keys.length===1)out[k]=prev?prev[k]:undefined;else if(isO&&v.$pa===1&&keys.length===1)out[k]=prevAny?prevAny[k]:undefined;else if(isO&&typeof v.$pp==='number'&&Array.isArray(v.t)&&keys.length===2)out[k]=((prev&&prev[k])||[]).slice(0,v.$pp).concat(v.t);else if(isO&&typeof v.$pe==='number'&&v.d&&Array.isArray(v.t)&&keys.length===3){const base=((prev&&prev[k])||[]).slice(0,v.$pe);Object.entries(v.d).forEach(([i,x])=>{base[Number(i)]=x;});out[k]=base.concat(v.t);}else out[k]=v;});return out;}
function expandLens(lens){if(!lens||!lens.compact)return lens;lens.cases.forEach(c=>{const prevBySeat={};let prevState=null,prevAny=null;(c.phases||[]).forEach(ph=>{(ph.actions||[]).forEach(a=>{const o=a.observation;if(o&&typeof o==='object'&&!Array.isArray(o)){a.observation=expandObj(o,prevBySeat[a.seat],prevAny);prevBySeat[a.seat]=a.observation;prevAny=a.observation;}});const st=ph.post_state;if(st&&typeof st==='object'&&!Array.isArray(st)){if(prevState)ph.post_state=expandObj(st,prevState,null);prevState=ph.post_state;}});if(c.terminal&&c.outcome&&typeof c.terminal==='object'){Object.entries(c.terminal).forEach(([k,v])=>{if(v&&typeof v==='object'&&v.$o===1&&Object.keys(v).length===1)c.terminal[k]=c.outcome[k];});}});return lens;}
async function loadLens(c){const m=LENS[c.id];if(!m||!m.file)return null;return lensCache[c.id]||(lensCache[c.id]=await getJSON(m.file).then(expandLens));}
const lensNote=c=>{const m=LENS[c.id];if(!m||m.kind==='none'||!m.file)return 'action-level grain only';if(m.kind==='narrated')return 'full-detail lens: observations, market state and a narrated reading';if(m.kind==='sealed')return 'full-detail lens: observations, states and consequences from the sealed event logs'+(m.shown_rule?` (${m.shown_rule})`:'');if(m.kind==='mixed')return `full detail for ${m.sealed} of ${m.cases} cases from sealed logs; the rest from case files`;return 'case definitions from the repository; the sealed logs for this run are not on this machine';};
let route={view:'catalog',family:null,campaign:null,caseId:null,step:0};

async function getJSON(path){const r=await fetch(path);if(!r.ok)throw new Error(path+' → '+r.status);const j=await r.json();if(!(j&&j.encoding==='gzip+base64'&&typeof j.payload==='string'))return j;if(typeof DecompressionStream==='undefined')throw new Error('this browser cannot inflate the data files (DecompressionStream missing)');const bin=atob(j.payload);const buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);const text=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();return JSON.parse(text);}
function save(){try{localStorage.setItem('aeread-examiner-route',JSON.stringify(route));}catch(e){}}
function crumbs(){
  const parts=[`<button data-go="catalog">Catalog</button>`];
  if(route.family) parts.push('›',`<button data-go="family">${esc(CAT.family_label[route.family]||route.family)}</button>`);
  if(route.campaign) parts.push('›',`<button data-go="campaign" class="mono">${esc(route.campaign)}</button>`);
  if(route.view==='results'&&route.campaign) parts.push('›',`<span class="cur">results</span>`);
  const caseCrumb=route.caseId&&(route.view==='step'||(route.view==='detail'&&route.detail&&['cell','invalid','rubric','ladder'].includes(route.detail.kind)));
  if(caseCrumb){const cd=route.campaign&&campaignCache[route.campaign];const kk=cd&&cd.cases.find(x=>x.receipt_sha256===route.caseId||(x.cell_id+'|'+x.episode_attempt_id)===route.caseId);parts.push('›',`<span class="cur mono">${esc(kk?kk.case_id+' · '+(kk.receipt_sha256||'').slice(0,10):String(route.caseId).slice(0,16))}</span>`);}
  if(route.view==='detail') parts.push('›',`<span class="cur">${esc(detailLabel())}</span>`);
  $('crumbs').innerHTML=parts.join(' ');
  $('crumbs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const g=b.dataset.go; if(g==='catalog'){route={view:'catalog',family:null,campaign:null,caseId:null,step:0};} else if(g==='family'){route.view='catalog';route.campaign=null;route.caseId=null;} else {route.view='campaign';route.caseId=null;} render();}));
}
const byId=id=>CAT.campaigns.find(c=>c.id===id);
function miniBar(check){const counts={yes:0,partial:0,no:0,na:0};check.forEach(i=>counts[stateCls(i.state)]++);const n=check.length||1;return `<span class="mini" title="${esc(Object.entries(counts).map(([k,v])=>k+' '+v).join(', '))}">${Object.entries(counts).map(([k,v])=>v?`<i class="${k}" style="width:${100*v/n}%"></i>`:'').join('')}</span>`;}

// ---------------- declared graphs per family ----------------
function familyGraphs(family){const pkg={datacenter_development_terms:'datacenter_development_terms'}[family]||family;return ((CAT.declared_graphs||{})[pkg]||[]).filter(v=>Array.isArray(v.nodes)&&v.nodes.length).slice().sort((a,b)=>a.nodes.length-b.nodes.length||a.edges.length-b.edges.length||String(a.variant||'').localeCompare(String(b.variant||'')));}
// When several declared graphs cover the phases a campaign ran, pick by the
// campaign's own identity (an interface-3 run gets the interface-3 graph, which
// adds the decline edge), then the tightest graph. The first match used to win,
// so interface-3 campaigns were drawn without their extra edge.
function bestDeclared(c,vs,nodes){const cand=vs.filter(v=>nodes.every(n=>v.nodes.includes(n)));if(cand.length<=1)return cand[0]||null;const wantIface=/interface3|iface3/.test(c.id);const pref=cand.filter(v=>/iface3/.test(v.variant||'')===wantIface);return (pref.length?pref:cand).sort((a,b)=>a.nodes.length-b.nodes.length||a.edges.length-b.edges.length)[0];}
// Curated facts a graph cannot carry: which family version and case folders a
// declared scope belongs to. Keyed by plugin and variant, as the build reports them.
const DECLARED_NOTES={
 'DataCenterDevelopmentPlugin|default':'family version 1.0.0 · case dev/service_loan_bankability_001',
 "DataCenterStackPlugin|init('v1',)":'family version 1.1.0 · case v1/power_epc_bankability_001',
 "DataCenterStackPlugin|init('v2',)":'family version 2.0.0 · cases v2/, worlds_v2/, worlds_v3/; the counteroffer ladders run its opening agreements',
 "DataCenterStackPlugin|init('v2',) iface3":'family version 2.0.0 with developer interface 3 · the same worlds',
};
const EDGE_NOTES={'land_amendment_developer_offer>loan_developer_offer':'the developer may decline the land amendment and go straight to the loan (interface 3; before it the phase had no way to say no, DC-D-10)'};
// A stack graph is a chain of agreements, each the same loop: developer offer,
// counterparty response (which may counter back to an offer), developer commit.
function stackParts(v){const re=/^(.+)_([a-z]+)_(offer|response|commit)$/;const parts=v.nodes.map(n=>n.match(re));if(!parts.every(Boolean))return null;const order=[];const role={};parts.forEach(m=>{if(!order.includes(m[1]))order.push(m[1]);if(m[3]==='response')role[m[1]]=m[2];});
 const std=new Set();order.forEach((k,i)=>{const o=parts.find(m=>m[1]===k&&m[3]==='offer'),r=parts.find(m=>m[1]===k&&m[3]==='response'),c=parts.find(m=>m[1]===k&&m[3]==='commit');if(o&&r){std.add(o[0]+'>'+r[0]);std.add(r[0]+'>'+o[0]);}if(r&&c)std.add(r[0]+'>'+c[0]);const nx=order[i+1]&&parts.find(m=>m[1]===order[i+1]&&m[3]==='offer');if(c&&nx)std.add(c[0]+'>'+nx[0]);});
 const extra=v.edges.map(e=>e.from+'>'+e.to).filter(k=>!std.has(k));return {order,role,extra};}
const agreementLabel=k=>({epc:'EPC (construction)',land_amendment:'land amendment'}[k]||k.replace(/_/g,' '));
const EDGE_SHORT={'land_amendment_developer_offer>loan_developer_offer':'decline'};
// The stack drawn one box per agreement, in the phase graph's own style, three
// to a row and snaking so it stays readable in a card; an edge outside the
// standard loop is a dashed arrow with its label.
function agreementSvg(sp){const n=sp.order.length,cols=Math.min(3,n),rows=Math.ceil(n/cols),BW=124,BH=44,GX=34,GY=36,M=10;
 const W=M*2+cols*BW+(cols-1)*GX,H=M*2+rows*BH+(rows-1)*GY+(sp.extra.length?30:0);
 const pos=sp.order.map((k,i)=>{const r=Math.floor(i/cols),j=i%cols,c=r%2===0?j:cols-1-j;return {x:M+c*(BW+GX),y:M+r*(BH+GY),r};});
 const keyOf=node=>{let best=-1;sp.order.forEach((k,i)=>{if(node.startsWith(k+'_')&&(best<0||k.length>sp.order[best].length))best=i;});return best;};
 let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="agreement sequence"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>`;
 const link=(a,b,dashed,label)=>{const A=pos[a],B=pos[b];let d,lx,ly;if(A.r===B.r&&dashed){const x1=A.x+BW/2,x2=B.x+BW/2,y=A.y+BH,dip=y+24;d=`M${x1},${y} C${x1},${dip} ${x2},${dip} ${x2},${y+2}`;lx=(x1+x2)/2;ly=dip+4;}else if(A.r===B.r){const dir=B.x>A.x?1:-1;const x1=dir>0?A.x+BW:A.x,x2=dir>0?B.x-2:B.x+BW+2,y=A.y+BH/2;d=`M${x1},${y} L${x2},${y}`;lx=(x1+x2)/2;ly=y+20;}else{const x=A.x+BW/2+(dashed?22:0);d=dashed?`M${x},${A.y+BH} C${x+16},${A.y+BH+12} ${x+16},${B.y-12} ${x},${B.y-2}`:`M${x},${A.y+BH} L${x},${B.y-2}`;lx=x+22;ly=(A.y+BH+B.y)/2+4;}
  return `<path d="${d}" fill="none" stroke="currentColor" stroke-width="1.3"${dashed?' stroke-dasharray="4 3"':''} marker-end="url(#ar)"/>${label?`<text class="sub" x="${lx}" y="${ly}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(label)}</text>`:''}`;};
 for(let i=0;i+1<n;i++)s+=link(i,i+1,false,'');
 sp.extra.forEach(e=>{const [f,to]=e.split('>');const kf=keyOf(f),kt=keyOf(to);if(kf>=0&&kt>=0&&kf!==kt)s+=link(kf,kt,true,EDGE_SHORT[e]||'extra edge');});
 sp.order.forEach((k,i)=>{const {x,y}=pos[i];const lab=agreementLabel(k);s+=`<rect x="${x}" y="${y}" width="${BW}" height="${BH}" rx="6" fill="var(--panel)" stroke="currentColor" stroke-width="1.3"/><text class="lab" x="${x+BW/2}" y="${y+19}" text-anchor="middle" font-size="${lab.length>16?10:11.5}" fill="currentColor">${esc(lab)}</text><text class="sub" x="${x+BW/2}" y="${y+34}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(sp.role[k]||'')} · 3 phases</text>`;});
 return s+'</svg>';}
function graphCard(v,current){const g={nodes:v.nodes,edges:v.edges,entry:v.nodes[0]};const sim=Object.values(v.modes||{}).filter(m=>m==='simultaneous').length;
 const sp=v.nodes.length>6?stackParts(v):null;const note=DECLARED_NOTES[`${v.plugin}|${v.variant||''}`]||'';
 const fam=CAT.campaigns.filter(c=>familyGraphs(c.family).includes(v));const users=fam.filter(c=>{const ph=(c.grain||{}).phases||[];return ph.length&&bestDeclared(c,familyGraphs(c.family),ph)===v;});
 const others=familyGraphs((fam[0]||{}).family||'').filter(o=>o!==v&&o.plugin===v.plugin&&(o.nodes.length<v.nodes.length||(o.nodes.length===v.nodes.length&&o.edges.length<v.edges.length)));const prev=others.length?others[others.length-1]:null;
 let diff='';if(prev&&sp){const pp=stackParts(prev);if(pp){const add=sp.order.filter(k=>!pp.order.includes(k)).map(agreementLabel);const E=new Set(prev.edges.map(e=>e.from+'>'+e.to));const newEdges=v.edges.map(e=>e.from+'>'+e.to).filter(k=>!E.has(k)&&sp.extra.includes(k));diff=[add.length?'adds '+add.join(', '):'',newEdges.length?'adds '+newEdges.length+' edge'+(newEdges.length>1?'s':'')+' (below)':''].filter(Boolean).join('; ');if(diff)diff=`Compared with the ${prev.nodes.length}-phase graph: ${diff}.`;}}
 const strip=sp?`<div class="graph gagg">${agreementSvg(sp)}</div><div class="muted" style="font-size:11.5px">One box per agreement; inside each, the same three phases: developer offer ⇄ counterparty response, then developer commit (${v.nodes.length} phases = ${sp.order.length} × 3).${sp.extra.map(k=>EDGE_NOTES[k]?` Dashed: ${esc(EDGE_NOTES[k])}.`:` Dashed: <span class="mono">${esc(k.replace('>',' → '))}</span>.`).join('')}</div>`:'';
 const used=users.length?`<details class="jd" style="margin-top:3px;font-size:11.5px"><summary>Published campaigns whose steps ran on this graph (${users.length})</summary><div style="margin-top:3px">${users.map(c=>`<button class="runnav" data-id="${esc(c.id)}" style="padding:0 5px;font-size:11px">${esc(c.id.replace(/^datacenter_/,''))}</button>`).join(' ')}</div></details>`:'<div class="muted" style="font-size:11.5px;margin-top:3px">No published campaign with steps ran on this graph (bundles that publish tables only are not matched).</div>';
 const svg=`<div class="graph${sp?' gfold':''}"${sp?' hidden':''}>${graphSvg(g,current||null,null,v.modes,v.actors)}</div>`;
 return `<div class="gcard"><div class="muted" style="font-size:11.5px;margin-bottom:3px"><span class="mono">${esc(v.plugin)}</span>${v.variant?` · ${esc(v.variant)}`:''} · ${v.nodes.length} phase${v.nodes.length!==1?'s':''}, ${v.edges.length} edge${v.edges.length!==1?'s':''}${sim?`, ${sim} simultaneous`:''}${sp?' <button class="gtoggle" data-gfull>show full graph</button>':v.nodes.length>6?' <button class="gtoggle" data-gt>full size</button>':''}</div>${note?`<div style="font-size:12px;margin-bottom:3px">${esc(note)}</div>`:''}${diff?`<div style="font-size:12px;margin-bottom:3px">${esc(diff)}</div>`:''}${strip}${svg}${used}</div>`;}
function wireGraphToggles(){document.querySelectorAll('[data-gfull]').forEach(b=>b.addEventListener('click',()=>{const g=b.closest('.gcard').querySelector('.gfold');g.hidden=!g.hidden;if(!g.hidden)g.classList.add('full');b.textContent=g.hidden?'show full graph':'hide full graph';}));document.querySelectorAll('.gcard .runnav').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();route.view='campaign';route.campaign=b.dataset.id;route.caseId=null;render();}));document.querySelectorAll('[data-gt]').forEach(b=>b.addEventListener('click',()=>{const g=b.closest('.gcard, .panel').querySelector('.graph');g.classList.toggle('full');b.textContent=g.classList.contains('full')?'fit':'full size';}));}
function campaignGraphs(c,observed){const vs=familyGraphs(c.family);if(observed&&observed.nodes&&observed.nodes.length){const m=bestDeclared(c,vs,observed.nodes);if(m)return {variants:[m],note:'declared graph matched to the phases in this bundle\'s trajectory grain'};return {variants:[{plugin:'observed',variant:'from the sealed grain',nodes:observed.nodes,edges:observed.edges,modes:{},actors:{}}],note:'no declared graph covers the phases seen; drawn from the observed transitions'};}
  if(vs.length>1){const id=c.id;const pick=vs.filter(v=>(/v2|counteroffer|interaction|objective/.test(id)&&/v2/.test(v.variant||''))||(/lemons/.test(id)&&/lemons/.test(v.variant||'')));if(pick.length)return {variants:pick,note:'declared variants matching this identity\'s scope; no trajectory grain to confirm'};}
  return {variants:vs,note:vs.length>1?'every declared variant for this family; no trajectory grain to pick one':'the family\'s declared graph'};}

// ---------------- catalog ----------------
function renderCatalog(){
  // the family with the most recent run comes first: what ran last is what needs reading first
  const lastAt=f=>CAT.campaigns.filter(c=>c.family===f).map(c=>(c.order||{}).at||'').sort().pop()||'';
  const fams=CAT.families.slice().sort((a,b)=>lastAt(b).localeCompare(lastAt(a))||CAT.campaigns.filter(c=>c.family===b).length-CAT.campaigns.filter(c=>c.family===a).length);
  if(!route.family) route.family=fams[0];
  const tabs=fams.map(f=>`<button data-f="${f}" class="${f===route.family?'cur':''}">${esc(CAT.family_label[f]||f)} <span class="muted">${CAT.campaigns.filter(c=>c.family===f).length}</span></button>`).join('');
  const list=CAT.campaigns.filter(c=>c.family===route.family).slice().sort((a,b)=>((a.order||{}).rank||1e9)-((b.order||{}).rank||1e9));
  const cellsOf=c=>{const g=c.grain||{};const planned=(c.facts.find(f=>f.key==='planned_cells')||{}).value,done=(c.facts.find(f=>f.key==='completed_cells')||{}).value;return planned!=null?`${done??'?'} / ${planned}`:(g.cases!=null?`${g.cases} cases`:(g.legacy_rows?`${g.legacy_rows} rows`:'—'));};
  const issuesOf=c=>c.issues.length?`${c.issues.length}${c.issues.some(i=>i.state==='open')?` <button class="chip no" data-openinc="${esc(c.id)}" title="the open rows, in full">${c.issues.filter(i=>i.state==='open').length} open ›</button>`:''}`:'<span class="muted">none</span>';
  const costOf=c=>{const g=c.grain||{};return c.manifest.total_cost_usd!=null?money(c.manifest.total_cost_usd):(g.cost_usd?money(g.cost_usd):'—');};
  const trajOf=c=>c.trajectory_file?((c.grain||{}).source==='sealed_logs'?'<span class="chip yes" title="the bundle publishes cell rows only; the steps come from the sealed event logs on this machine">sealed logs</span>':'<span class="chip yes">step grain</span>'):((c.grain||{}).legacy_rows?'<span class="chip na">cell rows</span>':`<span class="chip na" title="${esc((LENS[c.id]||{}).note||'no step grain published and no sealed logs on this machine')}">none</span>`);
  const BASIS_SHORT={'sealed receipts on this machine':'receipts on disk','first commit naming it':'first commit','date in the identity':'date in id','created_date in its reports':'report date'};
  const ranOf=c=>{const o=c.order||{};if(!o.at)return '<span class="muted">unknown</span>';const t=o.at.replace('T',' ').slice(0,16);const w=o.window;const title=`${o.basis}${w?` · ${w.receipts} receipts written ${w.start.replace('T',' ')} to ${w.end.replace('T',' ')}`:''}${o.git?` · first commit ${o.git.commit} ${o.git.date.slice(0,10)}: ${o.git.subject}`:''}`;return `<span class="mono" title="${esc(title)}">${esc(t)}</span><div class="basis" title="${esc(title)}">${esc(BASIS_SHORT[o.basis]||o.basis)}${w&&w.end&&w.end!==w.start?' · to '+esc(w.end.slice(11,16)):''}</div>`;};
  const rankOf=id=>{const m=byId(id);return m&&m.order?`<button class="runnav" data-id="${esc(id)}">#${m.order.rank}</button>`:esc(id);};
  const lineageOf=c=>{const parts=[];if(c.chain.length>1)parts.push(`${esc(c.version||'')} of ${c.chain.length} in <span class="mono">${esc(c.stem)}</span>`);const o=c.order||{};(o.refs||[]).forEach(r=>parts.push(`builds on ${rankOf(r)}`));(o.referred_by||[]).forEach(r=>parts.push(`used by ${rankOf(r)}`));return parts.join('<br>')||'<span class="muted">standalone</span>';};
  const stems={}; list.forEach(c=>{(stems[c.stem]=stems[c.stem]||[]).push(c);});
  // newest first by default: a chain sits where its most recent run falls, and runs of unknown time go last
  const old=!!route.oldestFirst;const rk=c=>(c.order||{}).rank;
  const stemKey=m=>old?Math.min(...m.map(c=>rk(c)??1e9)):Math.max(...m.map(c=>rk(c)??-1));
  const stemOrder=Object.entries(stems).sort((a,b)=>old?stemKey(a[1])-stemKey(b[1]):stemKey(b[1])-stemKey(a[1]));
  const rowOf=c=>`<tr class="click" data-id="${esc(c.id)}"><td class="mono">${c.order?c.order.rank:''}</td><td class="ran">${ranOf(c)}</td><td class="idc"><span class="mono">${esc(c.id)}</span> <span class="chip ${c.chain.latest?'acc':''}">${esc(c.version||c.date||'—')}${c.variant?' · '+esc(c.variant):''}</span></td><td class="what">${(c.models||[]).length?`<div style="margin-bottom:2px">${c.models.map(m=>`<span class="chip" title="model named in the bundle's reports">${esc(m)}</span>`).join(' ')}</div>`:(((c.grain||{}).profile_ids||[]).length?`<div style="margin-bottom:2px">${c.grain.profile_ids.slice(0,3).map(p=>`<span class="chip" title="profile id from the trajectory grain (the reports name no model id): ${esc(p)}"><span class="muted">profile</span> ${esc(p.length>42?p.slice(0,41)+'…':p)}</span>`).join(' ')}${c.grain.profile_ids.length>3?` <span class="muted">+${c.grain.profile_ids.length-3} more</span>`:''}</div>`:'')}${c.headline?`<div class="basis" style="white-space:normal">${esc(c.headline)}</div>`:''}${(()=>{const x=(c.readme||{}).summary||(c.order||{}).summary||'';const cut=x.length>140?x.slice(0,139).replace(/\s+\S*$/,'')+'…':x;return x?`<div class="muted" style="font-size:12px" title="${esc(x)}">${md(cut)}</div>`:'';})()}${(c.order||{}).claim?`<div class="basis" style="white-space:normal">claim: ${esc(c.order.claim.replace(/_/g,' '))}</div>`:''}</td><td>${esc(c.status.label)}</td><td>${issuesOf(c)}</td><td><button class="minibtn" data-checks="${esc(c.id)}" title="open this run's checklist; ${c.checklist.filter(i=>i.state!=='yes').length} line(s) need attention">${miniBar(c.checklist)}</button></td><td>${trajOf(c)}</td><td class="lin">${lineageOf(c)}</td></tr>`;
  const rows=stemOrder.map(([stem,members])=>{members.sort((a,b)=>a.chain.position-b.chain.position);const first=members[0],last=members[members.length-1];const lastRan=members.map(c=>(c.order||{}).at).filter(Boolean).sort().pop();const head=members.length>1?`<tr class="grp"><td colspan="9">chain <span class="mono">${esc(stem)}</span> · ${members.length} versions, ${esc(first.version||first.date||'')} → ${esc(last.version||last.date||'')} · ${old?`first ran ${esc(((first.order||{}).at||'unknown').replace('T',' ').slice(0,16))}`:`last ran ${esc((lastRan||'unknown').replace('T',' ').slice(0,16))}`} · latest <span class="mono">${esc(last.id)}</span></td></tr>`:'';return head+(old?members:members.slice().reverse()).map(rowOf).join('');}).join('');
  const groups=`<div class="stem">Run order <button class="dbtn" id="orderdir" title="switch the order">${old?'oldest first ⇅':'newest first ⇅'}</button> <span class="stemnote">· ${list.length} bundle${list.length!==1?'s':''}. ${old?'Version chains stay together, oldest version first; chains are placed by when their first version ran.':'Newest first: chains are placed by their most recent run, and the newest version heads each chain.'} # is each run's place in the family by time. “Ran” is when the bundle's sealed receipts were written on this machine, or else the first commit that names the identity (day precision).</span></div><div class="scroll"><table class="order"><thead><tr><th>#</th><th>ran</th><th>identity</th><th>model · what this run is (README)</th><th>status (as stated)</th><th>incident rows</th><th>validity checklist</th><th>trajectories</th><th>lineage</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  const famRows=(CAT.family_incidents[route.family]||[]);
  const famIssues=famRows.length?`<details style="margin-top:14px"><summary>${famRows.length} incident rows in this family's sections (all versions)</summary><div class="scroll"><table><thead><tr><th>id</th><th>state</th><th>section</th><th>defect</th><th>disposition</th></tr></thead><tbody>${famRows.map(r=>`<tr class="click" data-famrow="${esc(r.id)}"><td class="mono">${esc(r.id)}</td><td><span class="chip ${r.state==='open'?'no':r.state==='fixed'?'yes':'na'}">${esc(r.state)}</span></td><td>${esc(r.section)}</td><td style="white-space:normal">${md(r.defect)}</td><td style="white-space:normal">${md(r.disposition)}</td></tr>`).join('')}</tbody></table></div></details>`:'';
  const fg=familyGraphs(route.family);
  const oneNode=fg.length===1&&(fg[0].nodes||[]).length<=1;const graphs=fg.length?`<details class="panel" style="margin-bottom:8px" open><summary style="font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Phase graph${fg.length>1?'s':''} declared by the ${esc(CAT.family_label[route.family]||route.family)} plugin${fg.length>1?'s':''}${oneNode?` <span style="text-transform:none;letter-spacing:0;font-weight:400">· one phase, <span class="mono">${esc((fg[0].nodes||[''])[0])}</span>, repeated each turn</span>`:''}</summary><div class="gwrap" style="margin-top:6px">${fg.map(v=>graphCard(v)).join('')}</div></details>`:'';
  $('view').className='';
  $('view').innerHTML=`<p class="lede">Every published campaign bundle, grouped by version chain, newest first (# is each run's place in the family by time; families are ordered by their most recent run). Status is what the bundle and the QC profile state, never inferred beyond their words; the validity bar summarises the checklist on each campaign's page (green yes, amber partial, red no, grey not stated). Click a row.</p><div class="tabs">${tabs}</div>${graphs}${groups}${famIssues}`;
  $('view').querySelectorAll('.runnav').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();route.view='campaign';route.campaign=b.dataset.id;route.caseId=null;render();}));

  $('view').querySelectorAll('[data-openinc]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openDetail({kind:'incidents'},{campaign:b.dataset.openinc,caseId:null});}));
  $('view').querySelectorAll('[data-checks]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();route.view='campaign';route.campaign=b.dataset.checks;route.caseId=null;route.focus='checklist';render();}));

  $('view').querySelectorAll('.tabs button[data-f]').forEach(b=>b.addEventListener('click',()=>{route.family=b.dataset.f;render();}));wireGraphToggles();

// ---------------- campaign ----------------

  const qc=c.qc.sections.length?c.qc.sections.map(s=>`<div class="block"><div><span class="em">${esc(s.heading)}</span> <span class="muted mono">${esc(s.path||'')}</span></div>${s.gate_sentences.map(x=>`<p style="margin:4px 0">${md(x)}</p>`).join('')}${s.status_sentences.filter(x=>!s.gate_sentences.includes(x)).slice(0,4).map(x=>`<p class="muted" style="margin:4px 0">${md(x)}</p>`).join('')}</div>`).join(''):'<p class="muted">The family QC profile does not mention this identity.</p>';
  const g=c.grain||{};

  const attn=c.checklist.filter(i=>i.state!=='yes').length;
  const onePhase=cg.variants.length===1&&(cg.variants[0].nodes||[]).length<=1;
  const phaseHtml=`<section class="panel"><h2>Phase graph${onePhase?` <span style="text-transform:none;letter-spacing:0;font-weight:400">· one phase, <span class="mono">${esc((cg.variants[0].nodes||[''])[0])}</span>, repeated each turn</span>`:''}</h2><p class="muted" style="font-size:12px;margin:0 0 4px">${esc(cg.note)}</p><div class="gwrap">${cg.variants.map(v=>graphCard(v)).join('')}</div></section>`;

  <div class="grid2 wide">

  $('view').querySelectorAll('[data-ck]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();const it=c.checklist[Number(el.dataset.ck)];openDetail({kind:'check',id:it.id||null,i:Number(el.dataset.ck)});}));

// ---------------- results page ----------------

// ---------------- cases ----------------
async function renderCases(){
  const c=byId(route.campaign);
  $('view').className='loading'; $('view').textContent='Loading trajectories…';
  const data=campaignCache[c.id]||(campaignCache[c.id]=await getJSON(c.trajectory_file));
  await loadCards();if(CARDS&&data.cases.some(k=>CARDS.evaluations[k.receipt_sha256]))return renderCaseTable(c,data);
  const numericKeys=(()=>{const counts={};data.cases.forEach(k=>Object.entries(k.outcome_row||{}).forEach(([key,v])=>{if(typeof v==='number'||(typeof v==='string'&&v!==''&&!isNaN(Number(v))&&key.indexOf('sha256')<0)){counts[key]=(counts[key]||0)+1;}}));return Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).filter(k=>!/sha|index|seed|id$/.test(k)).slice(0,4);})();
  const seedOf=k=>{const r=k.outcome_row||{};const key=Object.keys(r).find(x=>x==='world_seed'||x.endsWith('.world_seed'));return key?r[key]:null;};const hasSeed=data.cases.some(k=>seedOf(k)!=null);const iseedOf=k=>{const r=k.outcome_row||{};const key=Object.keys(r).find(x=>x==='inference_seed'||x.endsWith('.inference_seed'));return key?r[key]:null;};const hasISeed=data.cases.some(k=>iseedOf(k)!=null);const archOf=id=>{const m=String(id).match(/^(.*?)(?:\.|_)?(\d+)$/);return m?{arch:m[1],n:m[2]}:{arch:id,n:''};};

// ---------------- graph layout (generic) ----------------
function layout(nodes,edges,entry){
  const est=t=>t.length*(t.length>30?6.3:7.1);const longest=Math.max(...nodes.map(n=>n.length));
  const wrap=longest>34;const lines=n=>{if(!wrap||n.length<=34)return [n];const cuts=[...n].map((c,i)=>c==='_'?i:-1).filter(i=>i>3&&i<n.length-4);const mid=n.length/2;const cut=cuts.length?cuts.reduce((b,i)=>Math.abs(i-mid)<Math.abs(b-mid)?i:b):Math.floor(mid)-1;return [n.slice(0,cut+1),n.slice(cut+1)];};
  const widest=Math.max(...nodes.flatMap(n=>lines(n).map(est)));const NODE_W=Math.max(150,Math.min(300,Math.round(widest)+22)),NODE_H=wrap?60:46,GX=56,GY=20;
  const stackLike=nodes.length>=6&&nodes.every(n=>/_(offer|response|commit)$/.test(n));
  const pos={};let W,H;
  if(stackLike){
    const keyOf=id=>id.split('_').slice(0,-2).join('_')||id.split('_')[0]; const order=[];nodes.forEach(n=>{const k=keyOf(n);if(!order.includes(k))order.push(k);});
    const rows={offer:0,response:1,commit:2};
    nodes.forEach(n=>{const kind=n.split('_').pop();pos[n]=[30+order.indexOf(keyOf(n))*(NODE_W+GX),30+(rows[kind]||0)*(NODE_H+44)];});
    W=30+order.length*(NODE_W+GX)-GX+40;H=30+3*(NODE_H+44)+10;
  } else if(nodes.length>=3&&nodes.length<=6&&(()=>{const nxt={};nodes.forEach(n=>nxt[n]=new Set());edges.forEach(e=>{if(nxt[e.from]&&e.to!==e.from)nxt[e.from].add(e.to);});let cur=entry&&nodes.includes(entry)?entry:nodes[0];const seen=[cur];for(let i=1;i<nodes.length;i++){const outs=[...nxt[cur]].filter(n=>!seen.includes(n));if(outs.length!==1)return false;cur=outs[0];seen.push(cur);}return nxt[cur].has(seen[0]);})()){
    // a simple cycle: walk it, first half down the left column, second half up the right
    const nxt={};nodes.forEach(n=>nxt[n]=new Set());edges.forEach(e=>{if(nxt[e.from]&&e.to!==e.from)nxt[e.from].add(e.to);});
    let cur=entry&&nodes.includes(entry)?entry:nodes[0];const order=[cur];for(let i=1;i<nodes.length;i++){cur=[...nxt[cur]].filter(n=>!order.includes(n))[0];order.push(cur);}
    const half=Math.ceil(order.length/2);
    order.forEach((n,i)=>{const col=i<half?0:1;const row=i<half?i:(order.length-1-i);pos[n]=[30+col*(NODE_W+GX+30),30+row*(NODE_H+40)];});
    W=30+2*(NODE_W+GX+30)-GX-30+40;H=30+half*(NODE_H+40)+10;
  } else {
    const nxt={};nodes.forEach(n=>nxt[n]=[]);edges.forEach(e=>{if(nxt[e.from]&&nodes.includes(e.to))nxt[e.from].push(e.to);});
    const depth={};const start=entry&&nodes.includes(entry)?entry:nodes[0];depth[start]=0;const q=[start];
    while(q.length){const u=q.shift();nxt[u].forEach(v=>{if(depth[v]==null){depth[v]=depth[u]+1;q.push(v);}});}
    nodes.forEach(n=>{if(depth[n]==null)depth[n]=Math.max(0,...Object.values(depth))+1;});
    const byLayer={};nodes.forEach(n=>{(byLayer[depth[n]]=byLayer[depth[n]]||[]).push(n);});
    const ncols=Math.max(...Object.keys(byLayer).map(Number))+1,nrows=Math.max(...Object.values(byLayer).map(a=>a.length));
    W=30+ncols*(NODE_W+GX)-GX+40;H=50+nrows*(NODE_H+GY)-GY+60;
    Object.entries(byLayer).forEach(([col,list])=>{const total=list.length*(NODE_H+GY)-GY;const y0=50+(nrows*(NODE_H+GY)-GY-total)/2;list.forEach((n,i)=>pos[n]=[30+Number(col)*(NODE_W+GX),y0+i*(NODE_H+GY)]);});
  }
  return {pos,W,H,NODE_W,NODE_H,lines,est};
}
function graphSvg(graph,current,round,modes,actors){
  const {pos,W,H,NODE_W,NODE_H,lines,est}=layout(graph.nodes,graph.edges,graph.entry);
  let s=`<svg viewBox="0 0 ${W} ${Math.max(H,140)}" width="${Math.min(W, 1400)}" role="img" aria-label="phase graph, current phase ${esc(current)}"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>`;
  let back=0;
  graph.edges.forEach(e=>{if(!pos[e.from]||!pos[e.to])return;const [ax,ay]=pos[e.from],[bx,by]=pos[e.to];
    if(e.from===e.to){const cx=ax+NODE_W/2;s+=`<path d="M${cx+16},${ay} C${cx+36},${ay-40} ${cx-36},${ay-40} ${cx-16},${ay}" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>`;return;}
    if(bx>ax){s+=`<line x1="${ax+NODE_W}" y1="${ay+NODE_H/2}" x2="${bx-2}" y2="${by+NODE_H/2}" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>`;}
    else if(bx===ax){const dir=by>ay?1:-1;const off=dir>0?-14:14;s+=`<line x1="${ax+NODE_W/2+off}" y1="${dir>0?ay+NODE_H:ay}" x2="${bx+NODE_W/2+off}" y2="${dir>0?by-2:by+NODE_H+2}" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>`;}
    else if(by===ay){s+=`<line x1="${ax}" y1="${ay+NODE_H/2}" x2="${bx+NODE_W+2}" y2="${by+NODE_H/2}" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>`;}
    else{back++;const drop=36+14*back;const x1=ax+NODE_W/2,y1=ay+NODE_H,x2=bx+NODE_W/2,y2=by+NODE_H+2,base=Math.max(y1,y2)+drop;s+=`<path d="M${x1},${y1} C${x1},${base} ${x2},${base} ${x2},${y2}" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>`;}
  });
  graph.nodes.forEach(n=>{const [x,y]=pos[n];const on=n===current;const sim=(modes||{})[n]==='simultaneous';
    s+=`<rect x="${x}" y="${y}" width="${NODE_W}" height="${NODE_H}" rx="6" fill="${on?'var(--accent)':'var(--panel)'}" stroke="${on?'var(--accent)':'currentColor'}" stroke-width="1.3"/>`;
    if(sim)s+=`<rect x="${x+4}" y="${y+4}" width="${NODE_W-8}" height="${NODE_H-8}" rx="4" fill="none" stroke="${on?'var(--panel)':'currentColor'}" stroke-width=".8" opacity=".8"/>`;
    const ls=lines(n);const fs=ls.some(l=>l.length>30)?10:11.5;const lh=fs+2;const top=y+(NODE_H-11-ls.length*lh)/2+fs;
    ls.forEach((l,li)=>{const fit=est(l)>NODE_W-10?` textLength="${NODE_W-10}" lengthAdjust="spacingAndGlyphs"`:'';s+=`<text class="lab" x="${x+NODE_W/2}" y="${top+li*lh}" text-anchor="middle" font-size="${fs}"${fit} fill="${on?'var(--panel)':'currentColor'}">${esc(l)}</text>`;});
    const sub=(actors||{})[n]?String((actors||{})[n]):'';if(sub)s+=`<text class="sub" x="${x+NODE_W/2}" y="${y+NODE_H-11}" text-anchor="middle" font-size="10" fill="${on?'var(--panel)':'var(--muted)'}">${esc(sub.length>26?sub.slice(0,25)+'…':sub)}</text>`;});
  if(round!=null)s+=`<text x="${W-10}" y="${Math.max(H,140)-8}" text-anchor="end" font-size="11" fill="var(--muted)">round ${round}</text>`;
  return '<div class="gscroll">'+s+'</svg></div>';
}
function pickGraph(c,observed){
  const pkg={datacenter_development_terms:'datacenter_development_terms'}[c.family]||c.family;
  const decl=(CAT.declared_graphs||{})[pkg]||[];
  const obsNodes=new Set(observed.nodes);

  return {graph:observed,modes:{},actors:{}};
}

  const groupOpts=['none',...cats,...(labelOK?[t.label]:[])];const usable=cats.filter(k=>{const n=new Set(t.rows.map(r=>r[k])).size;return n>=2&&n<=12;});const auto=usable.slice().sort((a,b)=>{const ia=GROUP_PREF.indexOf(a),ib=GROUP_PREF.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);})[0]||'none';const group=groupOpts.includes(st.group)?st.group:auto;
  const chart=(group==='none'&&t.label&&t.rows.length<=40)?barChart(t.rows,t.label,metric):stripChart(t.rows,group==='none'?null:group,metric);
  return `<div class="rcard" data-i="${i}"><div class="rhead"><span class="mono">${esc(t.file)}</span> <span class="muted">· ${esc(t.path)} · ${t.row_count} rows${t.note?' · '+esc(t.note):''}</span></div><div class="rctl"><label>metric <select data-k="metric">${t.numeric.map(m=>`<option ${m===metric?'selected':''}>${esc(m)}</option>`).join('')}</select></label><label>group by <select data-k="group">${groupOpts.map(g=>`<option ${g===group?'selected':''}>${esc(g)}</option>`).join('')}</select></label></div><div class="graph">${chart}</div><div class="legend" style="margin-top:2px">${(group==='none'&&t.label&&t.rows.length<=40)?'<span>bar = the row\'s value</span>':'<span>● one row</span><span><b style="color:var(--accent)">|</b> group mean</span><span><b style="color:var(--accent)">▬</b> 95% bootstrap interval of the mean (600 seeded resamples of the rows, treated as independent; computed here, not by the bundle)</span>'}</div><details class="jd"><summary>rows (${t.rows.length} of ${t.row_count})</summary>${jv(t.rows.slice(0,60))}</details></div>`;
}
// Headline tiles: a readable label (the last two path segments, underscores as
// spaces) and a short source; the full file and path stay in the hover title.
const tileKey=(path,c)=>{let k=path.split('.').slice(-2).join(' · ').replace(/_/g,' ');const cmp=c&&CARDS&&CARDS.comparisons&&CARDS.comparisons[c.id];if(cmp){const short=m=>String(m||'').split('/').pop();k=k.replace(/\bleft\b/g,short(cmp.left_model)).replace(/\bright\b/g,short(cmp.right_model));}return k;};
const tileSource=file=>{const f=String(file).replace(/^reports\//,'').replace(/\.json$/,'');const m=f.match(/^(comparison|confirmatory)_vs_/);return m?m[1]+' report':f.replace(/_/g,' ');};
function renderResults(c,res){
  const el=$('results');if(!el)return;
  if(!res||(!res.tables.length&&!res.intervals.length)){el.innerHTML='<h2>Results</h2><p class="muted" style="margin:0">This bundle publishes no numeric tables or interval estimates the examiner can chart.</p>';return;}
  const st=resultsUI[c.id]=resultsUI[c.id]||{};
  const rank=h=>(/rate|admission|mean|delta|score|margin|npv|regret|effect|fraction|share|median|payoff/i.test(h.path)?0:1)+(/cost|ceiling|max_|count|tokens|seed|budget/i.test(h.path)?2:0);
  const head=(res.headline||[]).slice().sort((a,b)=>rank(a)-rank(b)).slice(0,8).map(h=>`<div class="tile" title="${esc(h.file+' · '+h.path)}"><div class="k">${esc(tileKey(h.path,c))}</div><div class="v">${esc(fmtNum(h.value))}</div><div class="s">${esc(tileSource(h.file))}</div></div>`).join('');
  const ivs=res.intervals||[];const ivHtml=ivs.length?`<div class="rcard"><div class="rhead"><span class="em">Interval estimates</span> <span class="muted">· ${ivs.length} point estimates with a published interval; amber where the interval crosses zero</span></div><div class="graph ivgrid">${intervalChart(ivs.slice(0,40),c)}</div></div>`:'';
  res.tables.forEach(t=>{t._hints=res.primary_hints||[];});
  const cards=res.tables.map((t,i)=>tableCard(t,i,st[i]=st[i]||{})).join('');
  const hintLine=(res.primary_hints||[]).length?`<p class="muted" style="margin:0 0 6px;font-size:12.5px">The bundle names its guarded or primary metric: <span class="mono">${esc(res.primary_hints.join(', '))}</span>. Charts open on that metric where a table carries it.</p>`:'';
  el.innerHTML=`<h2>Results <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">· every numeric table and interval the bundle publishes, charted as published. Dots are rows; the bar is a 95% bootstrap interval of the group mean and the tick its mean (computed here, not by the bundle).</span></h2>${comparisonHtml(c)}${hintLine}${head?`<div class="tiles" style="margin-bottom:8px">${head}</div>`:''}${ivHtml}${cards}`;wireComparison(el);
  el.querySelectorAll('.rcard select').forEach(sel=>sel.addEventListener('change',()=>{const i=Number(sel.closest('.rcard').dataset.i);st[i][sel.dataset.k]=sel.value;renderResults(c,res);}));fitCharts();
}

// ---------------- draggable column gutters for the three-panel views ----------------
function colWidths(){try{const v=JSON.parse(localStorage.getItem('aeread-examiner-cols')||'null');if(v&&v.c1&&v.c3)return v;}catch(e){}return {c1:360,c3:340};}
// on a phone a wide chart keeps ~85% of its drawn size and scrolls in its own box, so labels stay readable
function fitCharts(){if(innerWidth>=760)return;document.querySelectorAll('#view svg').forEach(s=>{const vb=s.viewBox&&s.viewBox.baseVal;if(!vb||vb.width<=480)return;const box=s.parentElement;const avail=box.getBoundingClientRect().width;if(vb.width*0.85<=avail)return;s.style.maxWidth='none';s.style.width=Math.round(vb.width*0.85)+'px';s.style.height='auto';box.style.overflowX='auto';box.style.maxWidth='100%';});}
function wireGutters(){const grid=document.querySelector('.grid3');if(!grid||grid.querySelector('.gut'))return;const panels=[...grid.children];if(panels.length!==3)return;
  const g1=document.createElement('div'),g2=document.createElement('div');g1.className='gut';g2.className='gut';g1.title=g2.title='drag to resize · double-click to reset';panels[0].after(g1);panels[1].after(g2);
  const w=colWidths();grid.style.setProperty('--c1',w.c1+'px');if(!grid.classList.contains('rc'))grid.style.setProperty('--c3',w.c3+'px');else g2.classList.add('off');
  const start=(gut,which)=>e=>{if(e.button!==undefined&&e.button!==0)return;e.preventDefault();gut.classList.add('on');gut.setPointerCapture&&gut.setPointerCapture(e.pointerId);const x0=e.clientX,r=grid.getBoundingClientRect();const cur=colWidths();const c1=parseFloat(getComputedStyle(grid).getPropertyValue('--c1'))||cur.c1,c3=parseFloat(getComputedStyle(grid).getPropertyValue('--c3'))||cur.c3;
    const move=ev=>{const dx=ev.clientX-x0;if(which===1){const n=Math.max(220,Math.min(r.width-c3-320,c1+dx));grid.style.setProperty('--c1',n+'px');}else{const n=Math.max(180,Math.min(r.width-c1-320,c3-dx));grid.style.setProperty('--c3',n+'px');}};
    const up=()=>{gut.classList.remove('on');window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);const v={c1:parseFloat(grid.style.getPropertyValue('--c1'))||c1,c3:grid.classList.contains('rc')?cur.c3:(parseFloat(grid.style.getPropertyValue('--c3'))||c3)};try{localStorage.setItem('aeread-examiner-cols',JSON.stringify(v));}catch(err){}};
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);};
  g1.addEventListener('pointerdown',start(g1,1));g2.addEventListener('pointerdown',start(g2,2));
  [g1,g2].forEach(g=>g.addEventListener('dblclick',()=>{try{localStorage.removeItem('aeread-examiner-cols');}catch(e){}grid.style.setProperty('--c1','360px');if(!grid.classList.contains('rc'))grid.style.setProperty('--c3','340px');}));}
// ---------------- details: every line that needs attention opens a page saying what it rests on ----------------
// data/check_details.json (build_general_examiner.py) holds, per bundle, each checklist line's rule branch, the
// values it read, related statements it did not read and the files examined with digests; plus the check
// definitions with the QC standard's own words, and every incident row in full.
let DETAILS;async function loadDetails(){if(DETAILS===undefined){try{DETAILS=await getJSON('data/check_details.json');}catch(e){DETAILS=null;}}return DETAILS;}
function openDetail(d,patch){const snap={view:route.view,campaign:route.campaign,family:route.family,caseId:route.caseId,step:route.step,detail:route.detail};route.trail=(route.trail||[]).concat([snap]).slice(-12);Object.assign(route,patch||{});route.view='detail';route.detail=d;render();}
function swapDetail(d,patch){Object.assign(route,patch||{});route.detail=d;render();}
function goBack(){const t=route.trail||[];const b=t.length?t[t.length-1]:null;route.trail=t.slice(0,-1);if(b){Object.assign(route,b);}else{route.view=route.campaign?'campaign':'catalog';route.detail=null;}render();}
function detailLabel(){const d=route.detail||{};const c=route.campaign&&byId(route.campaign);if(d.kind==='check'&&c){const it=c.checklist.find(x=>d.id&&x.id===d.id)||c.checklist[d.i||0];return it?'check · '+(it.item.length>40?it.item.slice(0,39)+'…':it.item):'check';}
  return {incident:'incident '+(d.id||''),incidents:'incident rows',cell:d.focus==='breach'?'breach':'check '+(d.focus||''),invalid:'invalid steps',rubric:'verifier '+(d.focus||''),ladder:'score ladder'}[d.kind]||'details';}
const valHtml=v=>v==null?'<span class="muted">null</span>':esc(typeof v==='string'?v:JSON.stringify(v));
const dHead=(title,chips,sub,nav)=>`<section class="panel dhead"><div class="bar" style="margin:0 0 4px"><button data-back>‹ back</button><h3>${title}</h3>${chips||''}</div>${sub?`<p class="muted" style="margin:0;font-size:12.5px">${sub}</p>`:''}${nav||''}</section>`;
const runSub=c=>`<span class="mono">${esc(c.id)}</span> · run #${(c.order||{}).rank||'?'} of ${(c.order||{}).of||'?'} in ${esc(CAT.family_label[c.family]||c.family)} · ${esc(c.status.label)} <button class="dbtn" data-camp="${esc(c.id)}">campaign page</button>`;
function stmtTable(rows,cd){const sha={};((cd&&cd.files)||[]).forEach(f=>{sha[f.file]=f.sha256;});return `<div class="scroll"><table class="stm"><thead><tr><th>file</th><th>key</th><th>value</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="f" title="${esc(sha[r.file]?'sha256 '+sha[r.file]:'')}">${esc(r.file)}</td><td class="k">${esc(r.key)}${r.rows?` <span class="muted">(on ${r.rows} rows; first shown)</span>`:''}</td><td class="v">${valHtml(r.value)}${r.note?`<div class="muted">${esc(r.note)}</div>`:''}</td></tr>`).join('')}</tbody></table></div>`;}
const passageHtml=p=>`<div class="qsrc"><span class="mono">${esc(p.file)}:${p.line}</span> · ${esc(p.heading)}</div><div class="quote">${p.text.split('\n').map(l=>l.trim().startsWith('|')?l.split('|').map(x=>x.trim()).filter(Boolean).map(md).join(' — '):md(l)).join('\n')}</div>`;
const incStateText=s=>({open:'The disposition begins with “open”: the failure is recorded and its fix has not landed. Rows are never deleted; only the disposition changes.',fixed:'The disposition says fixed, corrected or closed: the failure is recorded and its fix has landed.',withdrawn:'The row was withdrawn; its text says why.',recorded:'Recorded with neither an open nor a fixed disposition; its text says what was done.'}[s]||'');
const incBody=r=>`<dl class="kv rowbody"><dt>defect</dt><dd>${md(r.defect||'—')}</dd><dt>detection</dt><dd>${md(r.detection||'—')}</dd><dt>cost</dt><dd>${md(r.cost||'—')}</dd><dt>disposition</dt><dd>${md(r.disposition||'—')}</dd></dl>`;
const incChip=s=>`<span class="chip ${s==='open'?'no':s==='fixed'?'yes':'na'}">${esc(s)}</span>`;
const fullRow=(id,fallback)=>((DETAILS&&DETAILS.incidents)||{})[id]||fallback;

function checkDetailHtml(c,d){
  const found=c.checklist.findIndex(x=>d.id&&x.id===d.id);const i=found>=0?found:Math.min(d.i||0,c.checklist.length-1);const it=c.checklist[i];if(!it)return null;
  const cd=DETAILS&&DETAILS.campaigns&&DETAILS.campaigns[c.id];const det=cd&&it.id?cd.items[it.id]:null;
  const kind=String(it.id||'').split(':')[0];const spec=DETAILS&&DETAILS.specs?DETAILS.specs[kind]:null;
  const gate=it.gate==='0-5'?'all gates':'Gate '+it.gate+' · '+(CAT.gate_names[it.gate]||'');
  const nav=`<div class="dnav">${c.checklist.map((x,j)=>`<button data-ckx="${j}" class="${j===i?'cur':''}" title="${esc(x.item)}"><span class="chip ${stateCls(x.state)} dchip">${esc(x.state)}</span> ${esc(x.item.length>36?x.item.slice(0,35)+'…':x.item)}</button>`).join('')}</div>`;
  const head=dHead(esc(it.item),`<span class="chip ${stateCls(it.state)}">${esc(STATE_LABEL[it.state]||it.state)}</span><span class="chip">${esc(gate)}</span>`,runSub(c)+(cd?` · read from <span class="mono">${esc(cd.path)}</span> on <span class="mono">${esc(cd.checkout)}</span>`:''),nav);
  if(!det)return head+`<section class="panel"><p class="muted" style="margin:0">This build carries no record of what the line rests on (<span class="mono">data/check_details.json</span> is missing or predates it). The line as listed: ${md(it.detail||'—')}</p></section>`;
  const understates=it.state==='not stated'&&det.related_total>0;
  const why=`<section class="panel"><h2>Why this line says “${esc(STATE_LABEL[it.state]||it.state)}”</h2><p class="why">${md(det.why)}</p>${understates?`<p class="banner" style="margin:8px 0 0">The rule found nothing under the keys it reads, but the bundle makes ${det.related_total} statement${det.related_total!==1?'s':''} on this subject under other names (below). “Not stated” may understate what the bundle carries; read them before treating the fact as missing.</p>`:''}${it.detail?`<p class="muted" style="font-size:12px;margin:8px 0 0">As listed on the checklist: ${md(it.detail)}</p>`:''}</section>`;
  const read=`<section class="panel"><h2>Values the rule read · ${det.evidence.length}</h2>${det.evidence.length?stmtTable(det.evidence,cd):`<p style="margin:0 0 4px;font-size:12.5px">None. The rule looks for</p><ul style="margin:0;padding-left:18px;font-size:12.5px">${((spec&&spec.reads)||[]).map(r=>`<li>${md(r)}</li>`).join('')}</ul><p class="muted" style="font-size:12.5px;margin:6px 0 0">and none of them is in the ${cd.files.length} file(s) listed under “Files examined”.</p>`}</section>`;
  const scanned=!['incidents','incident'].includes(kind);
  const rel=!scanned?'':(det.related||[]).length?`<section class="panel"><h2>What else the bundle says on this subject · ${det.related_total}</h2><p class="muted" style="font-size:12px;margin:0 0 6px">Keys in the manifest and reports whose name matches this check's subject and that the rule does not read. They do not change the line's state; they are shown so a reader can judge whether “${esc(it.state)}” understates or overstates what the bundle says.${det.related_total>det.related.length?` The first ${det.related.length} of ${det.related_total} are shown.`:''}</p>${stmtTable(det.related,cd)}</section>`:`<section class="panel"><h2>What else the bundle says on this subject</h2><p class="muted" style="margin:0;font-size:12.5px">Nothing: no other key in the manifest or reports names this subject.</p></section>`;
  let extra='';
  if(kind==='qc_profile')extra=`<section class="panel"><h2>Profile sections that name this run</h2>${c.qc.sections.length?c.qc.sections.map(s=>`<div class="block"><div><span class="em">${esc(s.heading)}</span> <span class="muted mono">${esc(s.path||'')}</span></div>${s.gate_sentences.map(x=>`<p style="margin:4px 0">${md(x)}</p>`).join('')||'<p class="muted" style="margin:4px 0">no sentence here states a gate outcome</p>'}${s.status_sentences.filter(x=>!s.gate_sentences.includes(x)).map(x=>`<p class="muted" style="margin:4px 0">${md(x)}</p>`).join('')}</div>`).join(''):'<p class="muted" style="margin:0">none; the profile does not name this identity</p>'}</section>`;
  if(kind==='incident'){const id=it.id.split(':')[1];const r=fullRow(id,c.issues.find(x=>x.id===id)||{});extra=`<section class="panel"><div class="bar" style="margin:0 0 4px"><h2 style="margin:0">Row <span class="mono">${esc(id)}</span></h2>${incChip(r.state||'open')}<button class="dbtn" data-inc="${esc(id)}">row page ›</button></div><p class="muted" style="font-size:12px;margin:0 0 4px">${esc(r.section||'')}${r.line?` · <span class="mono">docs/operations/incident_log.md:${r.line}</span>`:''}</p>${incBody(r)}</section>`;}
  if(kind==='incidents'){const rows=c.issues.filter(x=>x.direct);extra=rows.length?`<section class="panel"><h2>Rows that name this run · ${rows.length}</h2>${rows.map(x=>`<div class="block"><div class="bar" style="margin:0"><span class="mono em">${esc(x.id)}</span>${incChip(x.state)}<button class="dbtn ${x.state==='open'?'att':''}" data-inc="${esc(x.id)}">row page ›</button></div>${incBody(fullRow(x.id,x))}</div>`).join('')}</section>`:'';}
  const specHtml=spec?`<section class="panel"><h2>What this check asks</h2><p style="margin:0 0 8px;font-size:13px">${md(spec.asks)}</p><h3>It reads</h3><ul style="margin:0 0 8px;padding-left:18px;font-size:12.5px">${spec.reads.map(r=>`<li>${md(r)}</li>`).join('')}</ul><h3>How the state is decided</h3><table class="states"><tbody>${['yes','partial','no','not stated'].filter(s=>spec.states[s]&&spec.states[s]!=='not used').map(s=>`<tr class="${s===it.state?'hl':''}"><td><span class="chip ${stateCls(s)}">${esc(s)}</span></td><td style="white-space:normal">${md(spec.states[s])}</td></tr>`).join('')}</tbody></table><h3 style="margin-top:8px">What would change it</h3><p style="margin:0;font-size:12.5px">${md(spec.to_yes)}</p></section>`:'';
  const std=spec&&spec.standard.length?`<section class="panel"><h2>What the QC standard says</h2>${spec.standard.map(passageHtml).join('')}</section>`:'';
  const files=`<section class="panel"><details ${det.evidence.length?'':'open'}><summary style="font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Files examined · ${cd.files.length}</summary><div class="scroll" style="margin-top:6px"><table class="stm"><thead><tr><th>file</th><th>bytes</th><th>sha256</th></tr></thead><tbody>${cd.files.map(f=>`<tr><td class="f">${esc(cd.path)}/${esc(f.file)}</td><td class="nw">${f.bytes.toLocaleString()}</td><td class="v nw" title="${esc(f.sha256)}">${esc(f.sha256.slice(0,16))}…</td></tr>`).join('')||'<tr><td colspan="3" class="muted">the bundle has no manifest, README or report files</td></tr>'}</tbody></table></div><p class="muted" style="font-size:11.5px;margin:4px 0 0">Digests of the bytes this build read on <span class="mono">${esc(cd.checkout)}</span>; the evidence-lane review recomputes them from the committed files.</p></details></section>`;
  return head+`<div class="grid2" style="margin-top:8px"><div class="stack">${why}${extra}${read}${rel}</div><div class="stack">${specHtml}${std}${files}</div></div>`;
}

function incidentDetailHtml(c,id){
  const famRow=Object.values(CAT.family_incidents||{}).flat().find(x=>x.id===id);
  const link=c?c.issues.find(i=>i.id===id):null;
  const r=fullRow(id,link||famRow);
  if(!r)return dHead(`<span class="mono">${esc(id)}</span>`,'','This row is not in the incident log this build read.');
  const linked=CAT.campaigns.map(x=>({x,i:x.issues.find(i=>i.id===id)})).filter(o=>o.i);
  const head=dHead(`<span class="mono">${esc(id)}</span> · incident row`,incChip(r.state),`${esc(r.section||'')} · <span class="mono">docs/operations/incident_log.md${r.line?':'+r.line:''}</span>${r.checkout?` on <span class="mono">${esc(r.checkout)}</span>`:''}${c?` · opened from `+runSub(c):''}`);
  const whyLinked=c&&link?`<section class="panel"><h2>Why it is linked to this run</h2><p class="why">${link.direct?`It names this run: ${md(link.linked_by||'its text names the identity')}.`:`It does not name this run. It sits in this family's section and ${md(link.linked_by||'mentions a token of the identity')}. ${r.state==='open'?'An open row recorded against the design applies to every run of that design until its disposition changes, so the checklist carries it as a red line.':'It is closed, so it is background: it tells what went wrong in this design before, not what is wrong with this run.'}`}</p></section>`:'';
  const std=(DETAILS&&DETAILS.specs&&DETAILS.specs.incidents)?`<section class="panel"><h2>What the state means</h2><p style="margin:0 0 8px;font-size:12.5px">${md(incStateText(r.state))}</p>${DETAILS.specs.incidents.standard.map(passageHtml).join('')}</section>`:`<section class="panel"><h2>What the state means</h2><p style="margin:0;font-size:12.5px">${md(incStateText(r.state))}</p></section>`;
  const runs=`<section class="panel"><h2>Runs this row is linked to · ${linked.length}</h2>${linked.length?`<div class="scroll"><table class="stm"><thead><tr><th>run</th><th>how</th><th></th></tr></thead><tbody>${linked.map(o=>`<tr class="${c&&o.x.id===c.id?'hl':''}"><td class="k">${esc(o.x.id)}</td><td>${o.i.direct?'names it':'family design row'} · ${md(o.i.linked_by||o.i.link)}</td><td><button class="dbtn" data-camp="${esc(o.x.id)}">open ›</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted" style="margin:0;font-size:12.5px">No bundle in this build is linked to it.</p>'}</section>`;
  return head+`<div class="grid2" style="margin-top:8px"><div class="stack"><section class="panel"><h2>The row, in full</h2>${incBody(r)}</section>${whyLinked}</div><div class="stack">${std}${runs}</div></div>`;

function incidentsDetailHtml(c){
  const rows=c.issues.slice().sort((a,b)=>(a.state==='open'?0:1)-(b.state==='open'?0:1)||(a.direct?0:1)-(b.direct?0:1));

async function cellDetailHtml(c,d){

  return head+`<div class="grid2" style="margin-top:8px"><div class="stack">${top}${table}</div><div class="stack">${all}</div></div>`;
}

  const head=dHead(`Verifier · <span class="mono">${esc(r.id)}</span> · ${md(r.criterion)}`,`${verdictChip(r.result)}<span class="chip">${esc(r.component||'')}</span>`,runSub(c)+` · case <span class="mono">${esc(k.case_id)}</span> <button class="dbtn att" data-step="${at}">go to the deciding step ›</button>`,nav);

  const metrics=Object.entries(sc.metrics||{}).map(([n,m])=>`<span class="chip"><span class="muted">${esc(n.replace(/_/g,' '))}</span> ${esc(fmtNum(m.value))}${m.unit&&m.unit!=='indicator'?' '+esc(m.unit):''}</span>`).join(' ');
  const scoring=`<section class="panel"><h2>How this case is scored</h2><p style="margin:0 0 6px;font-size:12.5px">${esc(ad.rule||'')}</p><p style="margin:0 0 6px;font-size:12.5px"><strong>Score:</strong> ${sc.primary?`${esc(fmtNum(sc.primary.value))}${sc.primary.unit?' '+esc(sc.primary.unit):''}${sc.estimand?` (${esc(sc.estimand.estimand_id)}, ${esc(sc.estimand.direction||'')})`:''}`:'not in the sealed log for this case'}</p>${metrics?`<div style="display:flex;flex-wrap:wrap;gap:4px">${metrics}</div>`:''}</section>`;

// The score ladder of a procurement world: every reference policy's regret, and where this cell sits among them.
const LADDER_SEES={optimum:'full information',myopic:'full information',loyal:'full information',shopping:'full information',deadline_aware:'only what the buyer sees',displayed_price_greedy:'only what the buyer sees',listing_claim_fit:'only what the buyer sees',semantic_hint:'only what the buyer sees',defer:'nothing: it orders nothing','this cell':'only what the buyer sees'};
async function ladderDetailHtml(c,d){
  await loadCards();const data=campaignCache[c.id]||(campaignCache[c.id]=await getJSON(c.trajectory_file));const k=findCase(data);if(!k)return null;
  const f=cardFor(k);if(!f||!f.ev)return null;const {card,ev}=f;
  const lad=Object.entries(card.reference_ladder_regret_usd).concat([['this cell',ev.regret]]).sort((a,b)=>a[1]-b[1]);
  const ub=card.reference_solution.upper_bound_usd;const max=Math.max(...lad.map(x=>x[1]),1e-9);const focus=d.focus||'this cell';
  const pos=lad.findIndex(x=>x[0]==='this cell');const better=lad[pos-1],worse=lad[pos+1];
  const breach=['D4','D5'].some(id=>ev.checks[id]&&ev.checks[id].verdict==='fail');
  const head=dHead(`Score ladder · ${esc(card.stratum.replace(/_/g,' '))} · <span class="mono">${esc(card.world)}</span> · seed ${esc(ev.seed||'')}`,`<span class="chip acc">this cell ${fmt(ev.regret,1)} usd</span>${ub!=null?`<span class="chip">upper bound ${fmt(ub,1)} usd</span>`:''}${breach?'<span class="chip no">breach</span>':''}`,
    runSub(c)+` · <button class="dbtn" data-tocell="breach">this cell's checks ›</button> <button class="dbtn att" data-step="0">step through this cell ›</button>`,
    `<div class="dnav">${lad.map(([n,v])=>`<button data-ladder="${esc(n)}" class="${n===focus?'cur':''}" title="${esc(gloss(n))}">${esc(n)} <span class="muted">${fmt(v,1)}</span></button>`).join('')}</div>`);
  const fv=(lad.find(x=>x[0]===focus)||[])[1];const gap=fv!=null?ev.regret-fv:null;
  const reading=`<section class="panel"><h2>Where this cell sits</h2><p class="why">This cell's regret is <strong>${fmt(ev.regret,1)} USD</strong>${ub!=null?`: it earned ${fmt(ub-ev.regret,1)} of the ${fmt(ub,1)} USD a buyer with full information and the exact plan earns`:''}. ${better?`It is ${fmt(ev.regret-better[1],1)} USD behind <span class="mono">${esc(better[0])}</span>`:'Nothing ranks above it'}${worse?` and ${fmt(worse[1]-ev.regret,1)} USD ahead of <span class="mono">${esc(worse[0])}</span>`:''}. ${ev.regret<(card.reference_ladder_regret_usd.deadline_aware??Infinity)?'It beats <span class="mono">deadline_aware</span>, so D6 passes.':'It does not beat <span class="mono">deadline_aware</span>, the competent rule that sees only what the buyer sees, so D6 fails.'}${breach?' It breached (D4 or D5), which usually costs $100-200 on its own.':''}</p>
   ${focus!=='this cell'&&fv!=null?`<p class="why" style="margin-top:8px"><span class="mono em">${esc(focus)}</span>: ${esc(gloss(focus))} It sees ${esc(LADDER_SEES[focus]||'—')}. Its regret on this world is ${fmt(fv,1)} USD, so this cell is ${fmt(Math.abs(gap),1)} USD ${gap<=0?'better':'worse'}.</p>`:''}</section>`;
  const rowsHtml=lad.map(([n,v])=>{const me=n==='this cell';const g=ev.regret-v;return `<tr class="${n===focus?'hl':''}" ${me?'style="font-weight:600"':''}><td class="mono nw">${esc(n)}</td><td class="nw">${esc(LADDER_SEES[n]||'—')}</td><td class="nw mono" style="text-align:right">${fmt(v,1)}</td><td style="min-width:140px"><div style="height:8px;border-radius:2px;background:${me?'var(--accent)':'var(--na)'};opacity:${me?1:.55};width:${Math.max(1,100*v/max)}%"></div></td><td class="nw mono" style="text-align:right">${me?'—':(g<=0?`<span class="pos">${fmt(-g,1)} better</span>`:`<span class="neg">${fmt(g,1)} worse</span>`)}</td><td>${esc(me?'this run of the model on this world and seed':gloss(n))}</td></tr>`;}).join('');
  const table=`<section class="panel"><h2>The ladder</h2><table class="cct"><thead><tr><th>policy</th><th>sees</th><th>regret usd</th><th></th><th>this cell vs it</th><th>what it does</th></tr></thead><tbody>${rowsHtml}</tbody></table><p class="muted" style="font-size:11.5px;margin:4px 0 0">${esc(gloss('regret'))} Reference regrets are computed offline per world and published in the world card; the model's is from its sealed run.</p></section>`;
  const same=data.cases.map(x=>({x,e:CARDS.evaluations[x.receipt_sha256]})).filter(o=>o.e&&o.e.world_case_id===ev.world_case_id).sort((a,b)=>(a.e.seed||0)-(b.e.seed||0));
  const sameHtml=same.length>1?`<section class="panel"><h2>Same world, every seed in this run · ${same.length}</h2><table class="cct"><thead><tr><th>seed</th><th>regret usd</th><th>breach</th><th></th></tr></thead><tbody>${same.map(o=>{const me=o.x.receipt_sha256===k.receipt_sha256;const b=['D4','D5'].some(id=>o.e.checks[id]&&o.e.checks[id].verdict==='fail');return `<tr class="${me?'hl':''}"><td class="mono">${esc(o.e.seed)}</td><td class="mono">${fmt(o.e.regret,1)}</td><td>${b?'<span class="chip no">breach</span>':''}</td><td>${me?'<span class="muted">this cell</span>':`<button class="dbtn" data-othercell="${esc(o.x.receipt_sha256)}">open ›</button>`}</td></tr>`;}).join('')}</tbody></table><p class="muted" style="font-size:11.5px;margin:4px 0 0">Seeds of one world often repeat on a deterministic model; read the world, not the seed.</p></section>`:'';
  const common=CARDS.common||{};const howto=common['How to read a cell'],limits=common['Known limits'];
  const read=howto||limits?`<section class="panel"><h2>How to read a cell</h2>${proseHtml(howto)}${limits?`<h3 style="margin-top:6px">Known limits</h3>${proseHtml(limits)}`:''}</section>`:'';
  return head+`<div class="grid2" style="margin-top:8px"><div class="stack">${reading}${table}</div><div class="stack">${sameHtml}${read}</div></div>`;
}

  let html=null;
  if(d.kind==='check'&&c)html=checkDetailHtml(c,d);
  else if(d.kind==='incident')html=incidentDetailHtml(c,d.id);
  else if(d.kind==='incidents'&&c)html=incidentsDetailHtml(c);
  else if(d.kind==='cell'&&c&&c.trajectory_file)html=await cellDetailHtml(c,d);
  else if(d.kind==='invalid'&&c&&c.trajectory_file)html=await invalidDetailHtml(c);
  else if(d.kind==='rubric'&&c&&c.trajectory_file)html=await rubricDetailHtml(c,d);
  else if(d.kind==='ladder'&&c&&c.trajectory_file)html=await ladderDetailHtml(c,d);
  if(!html){route.view=c?'campaign':'catalog';route.detail=null;return render();}
  $('view').className='';$('view').innerHTML=html;$('view').scrollTop=0;
  const on=(sel,fn)=>$('view').querySelectorAll(sel).forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();fn(el);}));
  on('[data-back]',()=>goBack());
  on('[data-ckx]',el=>{const it=c.checklist[Number(el.dataset.ckx)];swapDetail({kind:'check',id:it.id||null,i:Number(el.dataset.ckx)});});
  on('[data-inc]',el=>openDetail({kind:'incident',id:el.dataset.inc}));
  on('[data-camp]',el=>{route.view='campaign';route.campaign=el.dataset.camp;route.caseId=null;route.detail=null;render();});
  on('[data-cellfocus]',el=>swapDetail({kind:'cell',focus:el.dataset.cellfocus}));
  on('[data-step]',el=>{route.view='step';route.step=Number(el.dataset.step);route.detail=null;render();});
  on('[data-rubric]',el=>swapDetail({kind:'rubric',focus:el.dataset.rubric}));
  on('[data-ladder]',el=>swapDetail({kind:'ladder',focus:el.dataset.ladder}));
  on('[data-tocell]',el=>swapDetail({kind:'cell',focus:el.dataset.tocell}));
  on('[data-othercell]',el=>swapDetail({kind:'ladder',focus:(route.detail||{}).focus},{caseId:el.dataset.othercell}));
}

// ---------------- router ----------------
async function render(){
  save(); crumbs();
  try{
    if(CARDS===undefined)await loadCards();
    if(route.view==='catalog')renderCatalog();
    else if(route.view==='campaign')renderCampaign();
    else if(route.view==='cases')await renderCases();
    else if(route.view==='results')await renderResultsPage();
    else if(route.view==='step')await renderStep();
    else if(route.view==='detail')await renderDetail();
    wireGutters();fitCharts();
  }catch(e){$('view').className='';$('view').innerHTML=`<section class="panel"><h3>Could not render this view</h3><p class="muted">${esc(e.message)}</p><p><button id="back">Back to catalog</button></p></section>`;$('back').addEventListener('click',()=>{route={view:'catalog',family:null,campaign:null,caseId:null,step:0};render();});}
  const c=route.campaign?byId(route.campaign):null;
  $('src').title=`Generated from the AERead repository on branch ${CAT.generated_from.branch}: publication manifests and reports under ${CAT.generated_from.evidence_root}, the sanitized trajectory grain, ${CAT.generated_from.incident_log}, and the family QC profiles. ${CAT.campaigns.length} bundles, ${CAT.campaigns.filter(x=>x.trajectory_file).length} with a step grain.` + (c?` Current: ${c.id}.`:'');
}
document.addEventListener('keydown',e=>{if(route.view!=='step'||e.target.tagName==='SELECT')return;if(e.key==='ArrowRight'){route.step++;render();e.preventDefault();}if(e.key==='ArrowLeft'){route.step=Math.max(0,route.step-1);render();e.preventDefault();}});
Promise.all([getJSON('data/catalog.json'),getJSON('data/lens/index.json').catch(()=>({})),getJSON('data/results/index.json').catch(()=>({}))]).then(([cat,lens,res])=>{CAT=cat;LENS=lens||{};RESULTS=res||{}; try{const saved=JSON.parse(localStorage.getItem('aeread-examiner-route')||'null'); if(saved&&saved.view&&(!saved.campaign||byId(saved.campaign)))route=saved;}catch(e){} if(route.view==='step'||route.view==='cases'||(route.view==='detail'&&(route.detail||{}).kind!=='incident')){if(!route.campaign||!byId(route.campaign))route={view:'catalog',family:null,campaign:null,caseId:null,step:0};} render();}).catch(e=>{$('view').className='';$('view').innerHTML=`<section class="panel"><h3>The catalog could not be loaded</h3><p class="muted">${esc(e.message)}</p></section>`;});
})();
</script>
