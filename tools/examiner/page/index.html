function goBack(){const t=route.trail||[];const b=t.length?t[t.length-1]:null;route.trail=t.slice(0,-1);if(b){Object.assign(route,b);}else{route.view=route.campaign?'campaign':'catalog';route.detail=null;}render();}
function detailLabel(){const d=route.detail||{};const c=route.campaign&&byId(route.campaign);if(d.kind==='check'&&c){const it=c.checklist.find(x=>d.id&&x.id===d.id)||c.checklist[d.i||0];return it?'check · '+(it.item.length>40?it.item.slice(0,39)+'…':it.item):'check';}
  return {incident:'incident '+(d.id||''),incidents:'incident rows',cell:d.focus==='breach'?'breach':'check '+(d.focus||''),invalid:'invalid steps',rubric:'verifier '+(d.focus||''),ladder:'score ladder'}[d.kind]||'details';}
const valHtml=v=>v==null?'<span class="muted">null</span>':esc(typeof v==='string'?v:JSON.stringify(v));
const dHead=(title,chips,sub,nav)=>`<section class="panel dhead"><div class="bar" style="margin:0 0 4px"><button data-back>‹ back</button><h3>${title}</h3>${chips||''}</div>${sub?`<p class="muted" style="margin:0;font-size:12.5px">${sub}</p>`:''}${nav||''}</section>`;
const runSub=c=>`<span class="mono">${esc(c.id)}</span> · run #${(c.order||{}).rank||'?'} of ${(c.order||{}).of||'?'} in ${esc(CAT.family_label[c.family]||c.family)} · ${esc(c.status.label)} <button class="dbtn" data-camp="${esc(c.id)}">campaign page</button>`;
function stmtTable(rows,cd){const sha={};((cd&&cd.files)||[]).forEach(f=>{sha[f.file]=f.sha256;});return `<div class="scroll"><table class="stm"><thead><tr><th>file</th><th>key</th><th>value</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="f" title="${esc(sha[r.file]?'sha256 '+sha[r.file]:'')}">${esc(r.file)}</td><td class="k">${esc(r.key)}${r.rows?` <span class="muted">(on ${r.rows} rows; first shown)</span>`:''}</td><td class="v">${valHtml(r.value)}${r.note?`<div class="muted">${esc(r.note)}</div>`:''}</td></tr>`).join('')}</tbody></table></div>`;}
const passageHtml=p=>`<div class="qsrc"><span class="mono">${esc(p.file)}:${p.line}</span> · ${esc(p.heading)}</div><div class="quote">${p.text.split('\n').map(l=>l.trim().startsWith('|')?l.split('|').map(x=>x.trim()).filter(Boolean).map(md).join(' — '):md(l)).join('\n')}</div>`;
const incStateText=s=>({open:'The disposition begins with “open”: the failure is recorded and its fix has not landed. Rows are never deleted; only the disposition changes.',fixed:'The disposition says fixed, corrected or closed: the failure is recorded and its fix has landed.',withdrawn:'The row was withdrawn; its text says why.',recorded:'Recorded with neither an open nor a fixed disposition; its text says what was done.'}[s]||'');
const incBody=r=>`<dl class="kv rowbody"><dt>defect</dt><dd>${md(r.defect||'—')}</dd><dt>detection</dt><dd>${md(r.detection||'—')}</dd><dt>cost</dt><dd>${md(r.cost||'—')}</dd><dt>disposition</dt><dd>${md(r.disposition||'—')}</dd></dl>`;
const incChip=s=>`<span class="chip ${s==='open'?'no':s==='fixed'?'yes':'na'}">${esc(s)}</span>`;
const fullRow=(id,fallback)=>((DETAILS&&DETAILS.incidents)||{})[id]||fallback;

function checkDetailHtml(c,d){
  const found=c.checklist.findIndex(x=>d.id&&x.id===d.id);const i=found>=0?found:Math.min(d.i||0,c.checklist.length-1);const it=c.checklist[i];if(!it)return null;
  const cd=DETAILS&&DETAILS.campaigns&&DETAILS.campaigns[c.id];const det=cd&&it.id?cd.items[it.id]:null;
  const kind=String(it.id||'').split(':')[0];const spec=DETAILS&&DETAILS.specs?DETAILS.specs[kind]:null;
  const gate=it.gate==='0-5'?'all gates':'Gate '+it.gate+' · '+(CAT.gate_names[it.gate]||'');
  const nav=`<div class="dnav">${c.checklist.map((x,j)=>`<button data-ckx="${j}" class="${j===i?'cur':''}" title="${esc(x.item)}"><span class="chip ${stateCls(x.state)} dchip">${esc(x.state)}</span> ${esc(x.item.length>36?x.item.slice(0,35)+'…':x.item)}</button>`).join('')}</div>`;
  const head=dHead(esc(it.item),`<span class="chip ${stateCls(it.state)}">${esc(STATE_LABEL[it.state]||it.state)}</span><span class="chip">${esc(gate)}</span>`,runSub(c)+(cd?` · read from <span class="mono">${esc(cd.path)}</span> on <span class="mono">${esc(cd.checkout)}</span>`:''),nav);
  if(!det)return head+`<section class="panel"><p class="muted" style="margin:0">This build carries no record of what the line rests on (<span class="mono">data/check_details.json</span> is missing or predates it). The line as listed: ${md(it.detail||'—')}</p></section>`;
  const understates=it.state==='not stated'&&det.related_total>0;
  const why=`<section class="panel"><h2>Why this line says “${esc(STATE_LABEL[it.state]||it.state)}”</h2><p class="why">${md(det.why)}</p>${understates?`<p class="banner" style="margin:8px 0 0">The rule found nothing under the keys it reads, but the bundle makes ${det.related_total} statement${det.related_total!==1?'s':''} on this subject under other names (below). “Not stated” may understate what the bundle carries; read them before treating the fact as missing.</p>`:''}${it.detail?`<p class="muted" style="font-size:12px;margin:8px 0 0">As listed on the checklist: ${md(it.detail)}</p>`:''}</section>`;
  const read=`<section class="panel"><h2>Values the rule read · ${det.evidence.length}</h2>${det.evidence.length?stmtTable(det.evidence,cd):`<p style="margin:0 0 4px;font-size:12.5px">None. The rule looks for</p><ul style="margin:0;padding-left:18px;font-size:12.5px">${((spec&&spec.reads)||[]).map(r=>`<li>${md(r)}</li>`).join('')}</ul><p class="muted" style="font-size:12.5px;margin:6px 0 0">and none of them is in the ${cd.files.length} file(s) listed under “Files examined”.</p>`}</section>`;
  const scanned=!['incidents','incident'].includes(kind);
  const rel=!scanned?'':(det.related||[]).length?`<section class="panel"><h2>What else the bundle says on this subject · ${det.related_total}</h2><p class="muted" style="font-size:12px;margin:0 0 6px">Keys in the manifest and reports whose name matches this check's subject and that the rule does not read. They do not change the line's state; they are shown so a reader can judge whether “${esc(it.state)}” understates or overstates what the bundle says.${det.related_total>det.related.length?` The first ${det.related.length} of ${det.related_total} are shown.`:''}</p>${stmtTable(det.related,cd)}</section>`:`<section class="panel"><h2>What else the bundle says on this subject</h2><p class="muted" style="margin:0;font-size:12.5px">Nothing: no other key in the manifest or reports names this subject.</p></section>`;
  let extra='';

  if(kind==='incident'){const id=it.id.split(':')[1];const r=fullRow(id,c.issues.find(x=>x.id===id)||{});extra=`<section class="panel"><div class="bar" style="margin:0 0 4px"><h2 style="margin:0">Row <span class="mono">${esc(id)}</span></h2>${incChip(r.state||'open')}<button class="dbtn" data-inc="${esc(id)}">row page ›</button></div><p class="muted" style="font-size:12px;margin:0 0 4px">${esc(r.section||'')}${r.line?` · <span class="mono">docs/operations/incident_log.md:${r.line}</span>`:''}</p>${incBody(r)}</section>`;}
  if(kind==='incidents'){const rows=c.issues.filter(x=>x.direct);extra=rows.length?`<section class="panel"><h2>Rows that name this run · ${rows.length}</h2>${rows.map(x=>`<div class="block"><div class="bar" style="margin:0"><span class="mono em">${esc(x.id)}</span>${incChip(x.state)}<button class="dbtn ${x.state==='open'?'att':''}" data-inc="${esc(x.id)}">row page ›</button></div>${incBody(fullRow(x.id,x))}</div>`).join('')}</section>`:'';}
  const specHtml=spec?`<section class="panel"><h2>What this check asks</h2><p style="margin:0 0 8px;font-size:13px">${md(spec.asks)}</p><h3>It reads</h3><ul style="margin:0 0 8px;padding-left:18px;font-size:12.5px">${spec.reads.map(r=>`<li>${md(r)}</li>`).join('')}</ul><h3>How the state is decided</h3><table class="states"><tbody>${['yes','partial','no','not stated'].filter(s=>spec.states[s]&&spec.states[s]!=='not used').map(s=>`<tr class="${s===it.state?'hl':''}"><td><span class="chip ${stateCls(s)}">${esc(s)}</span></td><td style="white-space:normal">${md(spec.states[s])}</td></tr>`).join('')}</tbody></table><h3 style="margin-top:8px">What would change it</h3><p style="margin:0;font-size:12.5px">${md(spec.to_yes)}</p></section>`:'';

  return head+`<div class="grid2" style="margin-top:8px"><div class="stack">${why}${extra}${read}${rel}</div><div class="stack">${specHtml}${std}${files}</div></div>`;

function incidentDetailHtml(c,id){
  const famRow=Object.values(CAT.family_incidents||{}).flat().find(x=>x.id===id);
  const link=c?c.issues.find(i=>i.id===id):null;
  const r=fullRow(id,link||famRow);
  if(!r)return dHead(`<span class="mono">${esc(id)}</span>`,'','This row is not in the incident log this build read.');

// The score ladder of a procurement world: every reference policy's regret, and where this cell sits among them.
const LADDER_SEES={optimum:'full information',myopic:'full information',loyal:'full information',shopping:'full information',deadline_aware:'only what the buyer sees',displayed_price_greedy:'only what the buyer sees',listing_claim_fit:'only what the buyer sees',semantic_hint:'only what the buyer sees',defer:'nothing: it orders nothing','this cell':'only what the buyer sees'};
async function ladderDetailHtml(c,d){

  const ub=card.reference_solution.upper_bound_usd;const max=Math.max(...lad.map(x=>x[1]),1e-9);const focus=d.focus||'this cell';
  const pos=lad.findIndex(x=>x[0]==='this cell');const better=lad[pos-1],worse=lad[pos+1];
  const breach=['D4','D5'].some(id=>ev.checks[id]&&ev.checks[id].verdict==='fail');
  const head=dHead(`Score ladder · ${esc(card.stratum.replace(/_/g,' '))} · <span class="mono">${esc(card.world)}</span> · seed ${esc(ev.seed||'')}`,`<span class="chip acc">this cell ${fmt(ev.regret,1)} usd</span>${ub!=null?`<span class="chip">upper bound ${fmt(ub,1)} usd</span>`:''}${breach?'<span class="chip no">breach</span>':''}`,
    runSub(c)+` · <button class="dbtn" data-tocell="breach">this cell's checks ›</button> <button class="dbtn att" data-step="0">step through this cell ›</button>`,
    `<div class="dnav">${lad.map(([n,v])=>`<button data-ladder="${esc(n)}" class="${n===focus?'cur':''}" title="${esc(gloss(n))}">${esc(n)} <span class="muted">${fmt(v,1)}</span></button>`).join('')}</div>`);
  const fv=(lad.find(x=>x[0]===focus)||[])[1];const gap=fv!=null?ev.regret-fv:null;
  const reading=`<section class="panel"><h2>Where this cell sits</h2><p class="why">This cell's regret is <strong>${fmt(ev.regret,1)} USD</strong>${ub!=null?`: it earned ${fmt(ub-ev.regret,1)} of the ${fmt(ub,1)} USD a buyer with full information and the exact plan earns`:''}. ${better?`It is ${fmt(ev.regret-better[1],1)} USD behind <span class="mono">${esc(better[0])}</span>`:'Nothing ranks above it'}${worse?` and ${fmt(worse[1]-ev.regret,1)} USD ahead of <span class="mono">${esc(worse[0])}</span>`:''}. ${ev.regret<(card.reference_ladder_regret_usd.deadline_aware??Infinity)?'It beats <span class="mono">deadline_aware</span>, so D6 passes.':'It does not beat <span class="mono">deadline_aware</span>, the competent rule that sees only what the buyer sees, so D6 fails.'}${breach?' It breached (D4 or D5), which usually costs $100-200 on its own.':''}</p>

  const same=data.cases.map(x=>({x,e:CARDS.evaluations[x.receipt_sha256]})).filter(o=>o.e&&o.e.world_case_id===ev.world_case_id).sort((a,b)=>(a.e.seed||0)-(b.e.seed||0));

  const common=CARDS.common||{};const howto=common['How to read a cell'],limits=common['Known limits'];
  const read=howto||limits?`<section class="panel"><h2>How to read a cell</h2>${proseHtml(howto)}${limits?`<h3 style="margin-top:6px">Known limits</h3>${proseHtml(limits)}`:''}</section>`:'';
  return head+`<div class="grid2" style="margin-top:8px"><div class="stack">${reading}${table}</div><div class="stack">${sameHtml}${read}</div></div>`;
}

async function renderDetail(){
  const d=route.detail||{};const c=route.campaign?byId(route.campaign):null;
  $('view').className='loading';$('view').textContent='Loading the details…';
  await loadDetails();
  let html=null;
  if(d.kind==='check'&&c)html=checkDetailHtml(c,d);
  else if(d.kind==='incident')html=incidentDetailHtml(c,d.id);
  else if(d.kind==='incidents'&&c)html=incidentsDetailHtml(c);
  else if(d.kind==='cell'&&c&&c.trajectory_file)html=await cellDetailHtml(c,d);
  else if(d.kind==='invalid'&&c&&c.trajectory_file)html=await invalidDetailHtml(c);
  else if(d.kind==='rubric'&&c&&c.trajectory_file)html=await rubricDetailHtml(c,d);
  else if(d.kind==='ladder'&&c&&c.trajectory_file)html=await ladderDetailHtml(c,d);
  if(!html){route.view=c?'campaign':'catalog';route.detail=null;return render();}
  $('view').className='';$('view').innerHTML=html;$('view').scrollTop=0;
  const on=(sel,fn)=>$('view').querySelectorAll(sel).forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();fn(el);}));
  on('[data-back]',()=>goBack());
  on('[data-ckx]',el=>{const it=c.checklist[Number(el.dataset.ckx)];swapDetail({kind:'check',id:it.id||null,i:Number(el.dataset.ckx)});});
  on('[data-inc]',el=>openDetail({kind:'incident',id:el.dataset.inc}));
  on('[data-camp]',el=>{route.view='campaign';route.campaign=el.dataset.camp;route.caseId=null;route.detail=null;render();});
  on('[data-cellfocus]',el=>swapDetail({kind:'cell',focus:el.dataset.cellfocus}));
  on('[data-step]',el=>{route.view='step';route.step=Number(el.dataset.step);route.detail=null;render();});
  on('[data-rubric]',el=>swapDetail({kind:'rubric',focus:el.dataset.rubric}));
  on('[data-ladder]',el=>swapDetail({kind:'ladder',focus:el.dataset.ladder}));
  on('[data-tocell]',el=>swapDetail({kind:'cell',focus:el.dataset.tocell}));
  on('[data-othercell]',el=>swapDetail({kind:'ladder',focus:(route.detail||{}).focus},{caseId:el.dataset.othercell}));
}

// ---------------- model comparisons, by stratum ----------------
// Every case that ran more than one model (data/model_comparisons.json, build_model_comparisons.py): cells with their
// independent unit, the strata the design fixes before a model acts, and each measure. The paired comparison per
// stratum is computed here, so any stratification and any pair of models can be chosen.
let MC;async function loadMC(){if(MC===undefined){try{MC=await getJSON('data/model_comparisons.json');}catch(e){MC=null;}}return MC;}
const MC_MIN=5;
function mcRng(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}let a=h>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// within the unit, equal weight per unit; the interval resamples independent clusters (a world with its twin)
function mcStats(s,mkey,dimsSel,A,B,fix){
 const ci=Object.fromEntries(s.cols.map((c,i)=>[c,i]));const meas=s.measures.find(m=>m.key===mkey)||{};
 const matched=s.matched!==false&&!meas.own_cells;const rest=s.dims.map(d=>d.key).filter(k=>!dimsSel.includes(k));const cl=s.clusters||{};
 const get=(m,k,mk)=>{let v=m.get(k);if(!v){v=mk();m.set(k,v);}return v;};const tree=new Map();
 for(const r of s.rows){const m=r[ci.model],v=r[ci[mkey]];if((m!==A&&m!==B)||v==null)continue;if(fix&&Object.keys(fix).some(k=>r[ci[k]]!==fix[k]))continue;
  const byUnit=get(tree,dimsSel.map(d=>r[ci[d]]).join('\u0001'),()=>new Map());const byCombo=get(byUnit,r[ci.unit],()=>new Map());
  const byModel=get(byCombo,rest.map(d=>r[ci[d]]).join('\u0001'),()=>new Map());get(get(byModel,m,()=>new Map()),r[ci.rep],()=>[]).push(v);}
 const out=[];
 for(const[sk,units]of tree){const per=[];
  for(const[u,combos]of units){const ca=[],cb=[],cd=[];
   for(const ms of combos.values()){const a=ms.get(A),b=ms.get(B);if(!a||!b)continue;let x,y;
    if(matched){const common=[...a.keys()].filter(k=>b.has(k));if(!common.length)continue;x=mcMean(common.map(k=>mcMean(a.get(k))));y=mcMean(common.map(k=>mcMean(b.get(k))));}
    else{x=mcMean([...a.values()].flat());y=mcMean([...b.values()].flat());}
    ca.push(x);cb.push(y);cd.push(x-y);}
   if(cd.length)per.push({u,c:cl[u]||u,a:mcMean(ca),b:mcMean(cb),d:mcMean(cd)});}
  if(!per.length)continue;
  const clusters=[...new Set(per.map(p=>p.c))].sort();let lo=null,hi=null;
  if(clusters.length>=MC_MIN){const by=new Map(clusters.map(c=>[c,per.filter(p=>p.c===c).map(p=>p.d)]));const rng=mcRng([s.id,mkey,sk,A,B].join('|'));const bs=[];
   for(let i=0;i<2000;i++){let sum=0,n=0;for(let j=0;j<clusters.length;j++){for(const x of by.get(clusters[Math.floor(rng()*clusters.length)])){sum+=x;n++;}}bs.push(sum/n);}
   bs.sort((x,y)=>x-y);lo=bs[50];hi=bs[1949];}
  const up=meas.better==='lower'?-1:1;const favA=per.filter(p=>up*p.d>0).length,favB=per.filter(p=>up*p.d<0).length;
  out.push({key:sk,vals:dimsSel.length?sk.split('\u0001'):[],n:per.length,clusters:clusters.length,a:mcMean(per.map(p=>p.a)),b:mcMean(per.map(p=>p.b)),d:mcMean(per.map(p=>p.d)),lo,hi,favA,favB,per});}
 // strata in the order the design declares its values
 const order=dimsSel.map(k=>(s.dims.find(d=>d.key===k).values||[]).map(v=>v.v));
 out.sort((x,y)=>{for(let i=0;i<order.length;i++){const d=order[i].indexOf(x.vals[i])-order[i].indexOf(y.vals[i]);if(d)return d;}return 0;});
 return out;}
function mcChart(title,rows,meas,s,A,B){if(!rows.length)return '';const W=820,labW=260,rowH=28,top=22,H=top+rows.length*rowH+26;
 const vals=rows.flatMap(r=>[r.d,r.lo,r.hi,...(r.per||[]).map(p=>p.d)]).filter(v=>v!=null);let lo=Math.min(0,...vals),hi=Math.max(0,...vals);if(hi===lo)hi=lo+1;const pad=(hi-lo)*0.06;lo-=pad;hi+=pad;const X=v=>labW+(W-labW-16)*(v-lo)/(hi-lo);
 const col=r=>{const v=mcVerdict(r,meas,A,B,s);return v.cls==='mca'?'var(--series-1)':v.cls==='mcb'?'var(--series-2)':'var(--muted)';};
 const ticks=niceTicks(lo,hi,6);let g=ticks.map(v=>`<line x1="${X(v)}" x2="${X(v)}" y1="${top-6}" y2="${H-22}" stroke="var(--rule)" stroke-width="${v===0?1.8:1}"/><text x="${X(v)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(mcFmt(v,meas,true))}</text>`).join('');
 rows.forEach((r,i)=>{const y=top+i*rowH+rowH/2;g+=`<text x="${labW-10}" y="${y+4}" text-anchor="end" font-size="11.5" fill="var(--ink)">${esc(r.label)}</text>`;
  // each world's own paired difference, under the stratum's estimate: whether the gap is every world's or a few
  (r.per||[]).forEach((p,j)=>{g+=`<circle cx="${X(p.d)}" cy="${y+((j*37)%9-4)*1.2}" r="2.3" fill="var(--ink)" opacity=".3"><title>${esc(`${s.unit.label} ${p.u}: ${mcFmt(p.d,meas,true)}`)}</title></circle>`;});
  if(r.lo!=null)g+=`<line x1="${X(r.lo)}" x2="${X(r.hi)}" y1="${y}" y2="${y}" stroke="${col(r)}" stroke-width="2.2" stroke-linecap="round"/>`;
  g+=`<circle cx="${X(r.d)}" cy="${y}" r="${r.lo==null?3.5:4.5}" fill="${r.lo==null?'var(--panel)':col(r)}" stroke="${col(r)}" stroke-width="1.6"><title>${esc(r.label+': '+mcFmt(r.d,meas,true)+(r.lo!=null?' ['+mcFmt(r.lo,meas,true)+', '+mcFmt(r.hi,meas,true)+']':' (no interval: too few units)'))}</title></circle>`;});
 return `<div style="font-size:12px;font-weight:600;margin:4px 0 2px">${esc(title)}</div><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block" role="img" aria-label="${esc(title)}">${g}<text x="${W-16}" y="${top-10}" text-anchor="end" font-size="10.5" fill="var(--muted)">right of 0: ${esc(mcLabel(s,A))} higher · small grey dots: each ${esc(s.unit.label)}'s difference · hollow dot: too few units for an interval</text></svg>`;}
// the model a run of a multi-run case played: the one model whose key appears in the run's identity
function mcRunModel(s,cid){if(!cid||s.campaigns.length<2||!s.campaigns.includes(cid))return null;const n=x=>String(x).toLowerCase().replace(/[^a-z0-9]/g,'');const hit=s.models.filter(m=>n(cid).includes(n(m.key)));return hit.length===1?hit[0].key:null;}
// default pair: this run's model first where the page belongs to one run of the case, against the model with most cells
function mcDefaultPair(s,cid){const models=s.models.map(m=>m.key);const cells=k=>s.rows.filter(r=>r[1]===k).length;const own=mcRunModel(s,cid);
 if(own){const other=models.filter(k=>k!==own).sort((x,y)=>cells(y)-cells(x)||mcLabel(s,x).localeCompare(mcLabel(s,y)))[0];return [own,other];}
 return models.slice().sort((x,y)=>cells(y)-cells(x)).slice(0,2).sort((x,y)=>mcLabel(s,x).localeCompare(mcLabel(s,y)));}
function mcLabel(s,key){const m=(s.models.find(x=>x.key===key)||{}).label;return m||key;}
function mcFmt(v,meas,diff){if(v==null||isNaN(v))return 'n/a';const u=meas.unit;
 if(u==='rate')return diff?(v>0?'+':'')+(v*100).toFixed(1)+' pp':(v*100).toFixed(1)+'%';
 const d=u==='ratio'?3:u==='count'?2:1;return (diff&&v>0?'+':'')+fmt(v,d);}
function mcVerdict(st,meas,A,B,s){
 if(st.lo==null)return {cls:'na',text:`${st.clusters} ${st.clusters===1?s.unit.label:s.unit.label+'s'}: too few for an interval`};
 const aHi=st.lo>0,bHi=st.hi<0;if(!meas.better)return {cls:'na',text:aHi||bHi?`${aHi?mcLabel(s,A):mcLabel(s,B)} higher`:'not separated'};
 const aBetter=meas.better==='higher'?aHi:bHi,bBetter=meas.better==='higher'?bHi:aHi;
 return aBetter?{cls:'mca',text:`${mcLabel(s,A)} better`}:bBetter?{cls:'mcb',text:`${mcLabel(s,B)} better`}:{cls:'na',text:'not separated'};}
function mcStratumName(s,dimsSel,vals){if(!dimsSel.length)return '<strong>All '+esc(s.unit.label)+'s</strong> <span class="muted">(no stratification)</span>';
 return dimsSel.map((k,i)=>{const d=s.dims.find(x=>x.key===k);const v=(d.values||[]).find(x=>x.v===vals[i])||{label:vals[i]};return `<span class="nw" title="${esc(v.note||d.note||'')}"><span class="muted">${esc(d.label)}:</span> ${defTag(v.v,esc(v.label),{family:s.family,dimension:d.key,kind:'stratum',campaign:(s.campaigns||[])[0]})}</span>`;}).join('<br>');}
function mcSetTime(s){return s.campaigns.map(id=>{const c=byId(id);return c&&c.order&&c.order.at||'';}).sort().pop()||'';}
function mcSets(){const pin=f=>{const i=FAMILY_ORDER.indexOf(f);return i<0?1e9:i;};return (MC.sets||[]).filter(s=>!HIDDEN_FAMILIES.has(s.family)).slice().sort((a,b)=>pin(a.family)-pin(b.family)||mcSetTime(b).localeCompare(mcSetTime(a))||a.title.localeCompare(b.title));}

// per-set choices (measure, split, pair), kept across views and visits
const MCS=(()=>{try{return JSON.parse(localStorage.getItem('aeread-examiner-mcs')||'{}')||{};}catch(e){return {};}})();

// One case's comparison, by stratum: it sits on the run page of every run in the case.
// An arm (the reasoning control a campaign sets on the model) is chosen from a menu, not split into rows: a split

const mcIsPick=d=>d.pick===true||d.key==='arm';
function mcPick(s,A,B,want){const d=s.dims.find(mcIsPick);if(!d)return null;const ci=Object.fromEntries(s.cols.map((c,i)=>[c,i]));

 const nameA=esc(mcLabel(s,A)),nameB=esc(mcLabel(s,B));

    else if(route.view==='models')await renderModels();
    else if(route.view==='defs')await renderDefs();
    wireGutters();fitCharts();
  }catch(e){$('view').className='';$('view').innerHTML=`<section class="panel"><h3>Could not render this view</h3><p class="muted">${esc(e.message)}</p><p><button id="back">Back to catalog</button></p></section>`;$('back').addEventListener('click',()=>{route={view:'catalog',family:null,campaign:null,caseId:null,step:0};render();});}
  const c=route.campaign?byId(route.campaign):null;
  $('src').title=`Generated from the AERead repository on branch ${CAT.generated_from.branch}: publication manifests and reports under ${CAT.generated_from.evidence_root}, the sanitized trajectory grain, ${CAT.generated_from.incident_log}, and the family QC profiles. ${CAT.campaigns.length} bundles, ${CAT.campaigns.filter(x=>x.trajectory_file).length} with a step grain.` + (c?` Current: ${c.id}.`:'');
}
document.addEventListener('keydown',e=>{if(route.view!=='step'||e.target.tagName==='SELECT')return;if(e.key==='ArrowRight'){route.step++;render();e.preventDefault();}if(e.key==='ArrowLeft'){route.step=Math.max(0,route.step-1);render();e.preventDefault();}});
// Families the owner has marked not ready are left out of every view (their data stays in the build).
const HIDDEN_FAMILIES=new Set(['datacenter_development_terms','commercial_state_calibration','procurement_grounding']);
const FAMILY_ORDER=['procurement_allocation','housing','refund','datacenter_development','govsim','econevals'];
document.getElementById('defbtn').addEventListener('click',()=>{route={view:'defs',family:null,campaign:null,caseId:null,step:0,mc:route.mc,defFocus:null};render();});
loadMC();document.getElementById('mcbtn').addEventListener('click',()=>{const mc=route.mc||{tab:'case'};route={view:'models',family:null,campaign:null,caseId:null,step:0,mc};render();});
Promise.all([getJSON('data/catalog.json'),getJSON('data/lens/index.json').catch(()=>({})),getJSON('data/results/index.json').catch(()=>({}))]).then(([cat,lens,res])=>{cat.campaigns=cat.campaigns.filter(c=>!HIDDEN_FAMILIES.has(c.family));cat.families=cat.families.filter(f=>!HIDDEN_FAMILIES.has(f));CAT=cat;LENS=lens||{};RESULTS=res||{}; try{const saved=JSON.parse(localStorage.getItem('aeread-examiner-route')||'null'); if(saved&&saved.view&&(!saved.campaign||byId(saved.campaign)))route=saved;}catch(e){} if(route.view==='step'||route.view==='cases'||(route.view==='detail'&&(route.detail||{}).kind!=='incident')){if(!route.campaign||!byId(route.campaign))route={view:'catalog',family:null,campaign:null,caseId:null,step:0};} render();}).catch(e=>{$('view').className='';$('view').innerHTML=`<section class="panel"><h3>The catalog could not be loaded</h3><p class="muted">${esc(e.message)}</p></section>`;});
})();
</script>
