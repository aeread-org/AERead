name: pr-lanes

# Classifies every pull request into a lane and enforces the one rule that
# differs between lanes (docs/operations/pr_lanes.md):
#
#   lane:kernel   -> needs one approving review, on the current head commit,
#                    from someone other than the author before it can merge.
#   lane:evidence -> review is verification (replay, digests, errata), pasted
#                    into the PR; no approval gate here.
#   lane:family   -> everything else; CI green is the gate.
#
# The `kernel-review` check is a required status check on `main`, so it must
# pass on every PR; it passes trivially for non-kernel lanes and for drafts.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-lanes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kernel-review:
    name: kernel-review
    runs-on: ubuntu-latest
    steps:
      - name: Classify the lane and enforce the kernel review rule
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          kernel=$(printf '%s\n' "$files" | grep -E '^(src/aeread/shared_runner/|src/aeread/cli\.py$|conftest\.py$|tests/conftest\.py$)' || true)
          evidence=$(printf '%s\n' "$files" | grep -E '^evidence/' || true)

          labels=()
          [ -n "$kernel" ] && labels+=("lane:kernel")
          [ -n "$evidence" ] && labels+=("lane:evidence")
          [ ${#labels[@]} -eq 0 ] && labels+=("lane:family")
          for label in lane:kernel lane:evidence lane:family; do
            gh label create "$label" --repo "$REPO" --color 5319e7 \
              --description "PR lane (docs/operations/pr_lanes.md)" 2>/dev/null || true
          done
          for label in lane:kernel lane:evidence lane:family; do
            gh pr edit "$PR" --repo "$REPO" --remove-label "$label" >/dev/null 2>&1 || true
          done
          gh pr edit "$PR" --repo "$REPO" --add-label "$(IFS=,; echo "${labels[*]}")" >/dev/null
          echo "lanes: ${labels[*]}"

          if [ -z "$kernel" ]; then
            echo "not a kernel-lane PR; no review gate"
            exit 0
          fi
          echo "kernel-lane files:"; printf '  %s\n' $kernel
          if [ "$DRAFT" = "true" ]; then
            echo "draft; the review gate applies once it is marked ready"
            exit 0
          fi
          # Latest review per reviewer, on the current head, excluding the author.
          approvals=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq "[ .[] | select(.user.login != \"$AUTHOR\") ]
                  | group_by(.user.login) | map(.[-1])
                  | map(select(.state == \"APPROVED\" and .commit_id == \"$HEAD_SHA\"))
                  | length")
          if [ "$approvals" -lt 1 ]; then
            echo "::error title=kernel review required::This PR changes kernel-lane paths and has no approving review on head $HEAD_SHA from someone other than $AUTHOR. See docs/operations/pr_lanes.md."
            exit 1
          fi
          echo "kernel review present: $approvals approving review(s) on head"

  pr-hygiene:
    name: pr-hygiene
    runs-on: ubuntu-latest
    # Advisory by design: this reports, it does not gate. It is deliberately
    # NOT a required status check on main, because both things it measures are
    # judgement calls that a person may reasonably override -- and a rule that
    # blocks a merge on a judgement call gets routed around rather than obeyed.
    steps:
      - name: Report WIP overrun and same-family collisions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail

          # --- 1. Work-in-progress limit (pr_lanes.md: 3 ready PRs per author).
          # Drafts do not count, per the rule.
          ready=$(gh pr list --repo "$REPO" --state open --author "$AUTHOR" \
            --limit 100 --json number,isDraft \
            --jq '[ .[] | select(.isDraft | not) ] | length')
          echo "ready-for-review PRs open by $AUTHOR: $ready"

          wip_note=""
          if [ "$ready" -gt 3 ]; then
            wip_note=$(printf '**WIP limit:** %s has **%s** ready-for-review PRs open; the limit is 3 (`docs/operations/pr_lanes.md`). This is not a merge gate. It is here because carrying many open branches is what let two people migrate the same three family scorers without noticing (#141).' "$AUTHOR" "$ready")
            echo "::warning title=WIP limit::$AUTHOR has $ready ready PRs open, limit is 3"
          fi

          # --- 2. Same-family collision: another open PR touching my families.
          mine=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' \
            | sed -n 's|^src/aeread_families/\([^/]*\)/.*|\1|p' | sort -u)
          collisions=""
          if [ -n "$mine" ]; then
            echo "families touched by this PR:"; printf '  %s\n' $mine
            others=$(gh pr list --repo "$REPO" --state open --limit 100 --json number,author \
              --jq '.[] | "\(.number) \(.author.login)"')
            while read -r num login; do
              [ "$num" = "$PR" ] && continue
              theirs=$(gh api "repos/$REPO/pulls/$num/files" --paginate --jq '.[].filename' 2>/dev/null \
                | sed -n 's|^src/aeread_families/\([^/]*\)/.*|\1|p' | sort -u || true)
              shared=$(comm -12 <(printf '%s\n' $mine) <(printf '%s\n' $theirs) 2>/dev/null || true)
              if [ -n "$shared" ]; then
                collisions="${collisions}- #${num} (@${login}) also touches: $(printf '%s ' $shared)"$'\n'
              fi
            done <<< "$others"
          fi

          body=""
          [ -n "$wip_note" ] && body="${wip_note}"$'\n\n'
          if [ -n "$collisions" ]; then
            body="${body}**Same-family collisions.** Another open PR touches a family this one touches:"$'\n\n'"${collisions}"$'\n'"Two branches on one family merged cleanly into a broken scorer once (#141): each added a \`__call__\` at a different point in the file, git saw no conflict, and Python kept the later one. \`tests/test_no_duplicate_class_members.py\` now catches that exact shape, but whoever lands second should still re-run the family's tests **against the merged file**, not against their own branch."$'\n'
            echo "::warning title=same-family collision::another open PR touches the same family"
          fi

          if [ -z "$body" ]; then
            echo "no WIP overrun, no same-family collision"
            exit 0
          fi

          # One comment per PR, updated in place rather than appended to.
          marker="<!-- pr-hygiene -->"
          body="${marker}"$'\n\n'"${body}"
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[ .[] | select(.body | startswith(\"$marker\")) ] | .[0].id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" >/dev/null
            echo "updated existing pr-hygiene comment"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
            echo "posted pr-hygiene comment"
          fi
