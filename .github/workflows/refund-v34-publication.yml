name: Refund V3.4 publication

on:
  pull_request:
    paths:
      - 'research/refund_v34/**'
      - 'evidence/refund/refund_v34_developmental_20261025/**'
      - '.github/workflows/refund-v34-publication.yml'
  push:
    branches: [main]
    paths:
      - 'research/refund_v34/**'
      - 'evidence/refund/refund_v34_developmental_20261025/**'

permissions:
  contents: read

jobs:
  native-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - name: Verify public native replay and descriptive recomputation
        run: python research/refund_v34/reproduce.py
      - name: Deterministic publication boundary and attribution tests
        run: python -m pytest -q --noconftest research/refund_v34/test_publication.py
